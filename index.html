<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050509"><title>Blizz</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050509;color:#fff;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;height:100%;overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer}.hidden{display:none!important}
#app{height:100%;min-height:100%;background:#050509}.screen{height:100%;overflow:auto}.center{display:grid;place-items:center;height:100%}.card{background:#111118;border:1px solid #272733;border-radius:20px;padding:18px}.field{width:100%;padding:14px 15px;border-radius:14px;border:1px solid #30303d;background:#0c0c12;color:#fff;margin:6px 0;outline:none}.primary{width:100%;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#7c4dff,#ff3ca6);color:#fff;font-weight:800}.ghost{padding:10px 13px;border:1px solid #30303d;border-radius:13px;background:#111118;color:#fff}.muted{color:#a5a5b5}.danger{color:#ff647c}.top{position:fixed;z-index:20;top:0;left:0;right:0;height:62px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:linear-gradient(#050509,transparent);pointer-events:none}.top>*{pointer-events:auto}.brand{font-weight:900;font-size:20px}.topTabs{display:flex;gap:18px;font-weight:800;position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap}.topTabs button{background:none;border:0;color:#9d9da8;padding:8px 0}.topTabs button.active{color:#fff;border-bottom:2px solid #fff}.iconBtn{width:38px;height:38px;border-radius:50%;border:1px solid #343440;background:#111118;color:#fff}.live{color:#ff526f;font-weight:900}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory}.post{height:100%;min-height:100%;position:relative;scroll-snap-align:start;background:#101016;display:flex;align-items:center;justify-content:center}.postMedia{width:100%;height:100%;object-fit:cover;background:#111}.shade{position:absolute;inset:45% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.88));pointer-events:none}.postInfo{position:absolute;left:14px;right:82px;bottom:86px}.postInfo b{font-size:17px}.postInfo p{margin:7px 0}.actions{position:absolute;right:10px;bottom:86px;display:flex;flex-direction:column;gap:15px;align-items:center}.action{background:none;border:0;color:#fff;text-align:center;font-size:12px}.action span{display:block;font-size:27px}.action.liked span{color:#ff2d55}.avatar{width:50px;height:50px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#222}.plus{position:absolute;top:40px;right:-2px;background:#ff2d55;border-radius:50%;width:18px;height:18px;display:grid;place-items:center;font-size:13px}
.bottom{position:fixed;z-index:30;bottom:0;left:0;right:0;height:70px;background:rgba(5,5,9,.95);display:flex;justify-content:space-around;align-items:center;border-top:1px solid #20202a}.nav{background:none;border:0;color:#92929e;font-size:11px}.nav b{display:block;font-size:22px;color:inherit}.nav.active{color:#fff}.createBtn{width:48px;height:34px;border-radius:11px;background:linear-gradient(135deg,#fff,#aaa);color:#050509;border:0;font-size:25px;font-weight:900}
.page{height:100%;overflow:auto;padding:76px 14px 90px}.pageHead{display:flex;align-items:center;gap:10px;margin-bottom:16px}.pageHead h1{margin:0;font-size:24px}.back{background:none;border:0;color:#fff;font-size:24px}.grid{display:grid;gap:12px}.userRow{display:flex;gap:12px;align-items:center;padding:13px;border:1px solid #24242f;background:#101016;border-radius:16px}.miniAvatar{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#222}.grow{flex:1}.rowBtns{display:flex;gap:7px}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#191923;color:#bbb;font-size:12px}.matchCard{min-height:65vh;border-radius:26px;overflow:hidden;position:relative;background:#15151d}.matchCard img{width:100%;height:100%;object-fit:cover}.matchOverlay{position:absolute;left:0;right:0;bottom:0;padding:25px;background:linear-gradient(transparent,rgba(0,0,0,.9))}.matchBtns{display:flex;gap:14px;justify-content:center;margin-top:14px}.round{width:58px;height:58px;border-radius:50%;border:0;font-size:24px}.pass{background:#2b2b36;color:#fff}.like{background:#ff2d67;color:#fff}
.chat{height:100%;display:flex;flex-direction:column}.chatHead{padding:15px;padding-top:66px;border-bottom:1px solid #252530;display:flex;gap:10px;align-items:center}.chatMessages{flex:1;overflow:auto;padding:15px}.bubble{max-width:78%;padding:11px 13px;border-radius:17px;margin:7px 0}.mine{margin-left:auto;background:#7048ff}.theirs{background:#1a1a23}.composer{display:flex;gap:7px;padding:9px;border-top:1px solid #252530;background:#08080d}.composer input{flex:1}.composer button{width:48px}
.camera{height:100%;background:#000;position:relative}.camera video,.camera img{width:100%;height:100%;object-fit:cover}.camBar{position:absolute;bottom:25px;left:0;right:0;display:flex;justify-content:space-around;align-items:center}.capture{width:72px;height:72px;border-radius:50%;border:5px solid #fff;background:transparent}.editor{height:100%;background:#0a0a0f;padding:20px}.preview{height:58%;border-radius:20px;overflow:hidden;background:#15151c;display:grid;place-items:center}.preview video,.preview img{width:100%;height:100%;object-fit:contain}.tools{display:flex;gap:8px;overflow:auto;padding:12px 0}.tools button{white-space:nowrap}.postForm{display:grid;gap:8px}
.toast{position:fixed;z-index:100;left:50%;bottom:85px;transform:translateX(-50%);background:#fff;color:#000;padding:10px 15px;border-radius:999px;font-weight:700;max-width:90%;box-shadow:0 10px 30px #0008}
.empty{padding:40px 15px;text-align:center;color:#8d8d99}.error{color:#ff667d;min-height:20px;margin:5px 0}.logo{font-size:40px;font-weight:1000;background:linear-gradient(135deg,#7c4dff,#ff3ca6,#ff9a3c);-webkit-background-clip:text;color:transparent}
</style></head><body><div id="app"></div><div id="toast" class="toast hidden"></div>
<script>
const app=document.getElementById('app');let token=localStorage.getItem('blizz_token')||'',me=JSON.parse(localStorage.getItem('blizz_user')||'null');let route='home',tab='forYou',feedPosts=[],mediaBlob=null,stream=null,chatPeer=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(url,opt={}){const h=opt.headers||{};if(token)h.Authorization='Bearer '+token;opt.headers=h;const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'Request failed');return d}
function save(d){token=d.token||token;me=d.user||me;if(token)localStorage.setItem('blizz_token',token);if(me)localStorage.setItem('blizz_user',JSON.stringify(me))}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2200)}
function nav(){return `<nav class="bottom"><button class="nav ${route==='home'?'active':''}" onclick="go('home')"><b>⌂</b>Home</button><button class="nav ${route==='match'?'active':''}" onclick="go('match')"><b>⚔</b>Match</button><button class="createBtn" onclick="go('create')">+</button><button class="nav ${route==='messages'?'active':''}" onclick="go('messages')"><b>▣</b>Inbox</button><button class="nav ${route==='profile'?'active':''}" onclick="go('profile')"><b>●</b>Profile</button></nav>`}
function shell(content,withNav=true){app.innerHTML=content+(withNav?nav():'')}
function go(r){stopCamera();route=r;render()}
async function render(){try{if(!token&& !['auth'].includes(route))return auth();({home,profile,search,messages,chat,match,games,create,editprofile,notifications}[route]||home)()}catch(e){app.innerHTML=`<div class="center"><div class="card" style="max-width:340px"><div class="logo">Blizz</div><h2>Something went wrong</h2><p class="muted">${esc(e.message)}</p><button class="primary" onclick="location.reload()">Reload Blizz</button></div></div>`}}
function auth(){shell(`<main class="center"><div class="card" style="width:min(92%,390px)"><div class="logo">Blizz</div><p class="muted">Connect • Watch • Play • Create</p><div id="authErr" class="error"></div><input id="loginId" class="field" placeholder="Username or email"><input id="loginPw" class="field" type="password" placeholder="Password"><button class="primary" onclick="login()">LOG IN</button><p class="muted" style="text-align:center">New here? <button class="ghost" onclick="signup()">Create account</button></p></div></main>`,false)}
function signup(){shell(`<main class="center"><div class="card" style="width:min(92%,390px);max-height:95%;overflow:auto"><button class="back" onclick="auth()">←</button><div class="logo">Blizz</div><div id="authErr" class="error"></div><input id="su" class="field" placeholder="Username"><input id="sd" class="field" placeholder="Display name"><input id="se" class="field" type="email" placeholder="Email"><input id="sp" class="field" type="password" placeholder="Password (8+ characters)"><input id="sb" class="field" type="date"><select id="sg" class="field"><option value="">Gender</option><option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option></select><button class="primary" onclick="createAccount()">CREATE ACCOUNT</button></div></main>`,false)}
async function login(){const e=document.getElementById('authErr');try{e.textContent='Signing in…';save(await api('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({login:loginId.value,password:loginPw.value})}));go('home')}catch(x){e.textContent=x.message}}
async function createAccount(){const e=document.getElementById('authErr');try{e.textContent='Creating account…';save(await api('/api/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:su.value,displayName:sd.value,email:se.value,password:sp.value,dob:sb.value,gender:sg.value})}));go('home')}catch(x){e.textContent=x.message}}
async function home(){shell(`<div class="top"><button class="ghost live" onclick="toast('LIVE is ready for the connected live-stream service')">● LIVE</button><div class="topTabs"><button class="${tab==='following'?'active':''}" onclick="setTab('following')">Following</button><button class="${tab==='friends'?'active':''}" onclick="setTab('friends')">Friends</button><button class="${tab==='forYou'?'active':''}" onclick="setTab('forYou')">For You</button></div><button class="iconBtn" onclick="go('search')">⌕</button></div><div id="feed" class="feed"><div class="center"><div class="muted">Loading Blizz…</div></div></div>`);await loadFeed();enableSwipe()}
async function loadFeed(){try{const d=await api('/api/feed?tab='+tab);feedPosts=d.posts||[];const f=document.getElementById('feed');f.innerHTML=feedPosts.length?feedPosts.map(postCard).join(''):`<div class="center"><div class="empty"><h2>No videos yet</h2><p>Follow people or create the first Blizz post.</p><button class="primary" style="max-width:260px" onclick="go('create')">Create a post</button></div></div>`}catch(e){document.getElementById('feed').innerHTML=`<div class="center"><div class="empty">${esc(e.message)}</div></div>`}}
function postCard(p){const avatar=p.profileMediaId?`/api/media/${p.profileMediaId}`:'';const media=p.url?(p.url.includes('/api/media/')&&/^video\//.test(p.mime||'')?`<video class="postMedia" src="${p.url}" playsinline loop controls></video>`:`<img class="postMedia" src="${p.url}">`):'';return `<article class="post" data-post="${p.id}">${media}<div class="shade"></div><div class="postInfo"><div style="position:relative;display:inline-block"><img class="avatar" src="${avatar}" onerror="this.style.display='none'"><span class="plus">+</span></div><div><b onclick="openUser('${esc(p.username)}')">@${esc(p.username)}</b></div><p>${esc(p.caption)}</p></div><div class="actions"><button class="action" onclick="openUser('${esc(p.username)}')"><span>👤</span>Profile</button><button class="action ${p.liked?'liked':''}" onclick="likePost('${p.id}',this)"><span>♥</span><b>${p.likes||0}</b></button><button class="action" onclick="commentPost('${p.id}')"><span>💬</span><b>${p.comments||0}</b></button><button class="action" onclick="navigator.clipboard?.writeText(location.href);toast('Link copied')"><span>↗</span>Share</button></div></article>`}
function setTab(t){tab=t;home()}function enableSwipe(){let sx=0;const el=document.getElementById('feed');el?.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});el?.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>70){const a=['following','friends','forYou'];let i=a.indexOf(tab);i=dx<0?Math.min(2,i+1):Math.max(0,i-1);setTab(a[i])}})}
async function likePost(id,b){try{const d=await api('/api/like',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postId:id})});b.classList.toggle('liked',d.liked);const n=b.querySelector('b');n.textContent=Number(n.textContent)+(d.liked?1:-1)}catch(e){toast(e.message)}}
async function commentPost(id){const t=prompt('Write a comment');if(!t)return;try{await api('/api/comment',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({postId:id,text:t})});toast('Comment added')}catch(e){toast(e.message)}}
async function openUser(username){route='profile';profile(username);route='profile'}
async function profile(username=me?.username){const own=username===me?.username;try{const d=await api('/api/users/'+encodeURIComponent(username));const u=d.user;const pic=u.profileMediaId?`/api/media/${u.profileMediaId}`:'';shell(`<main class="page"><div class="pageHead"><button class="back" onclick="go('home')">←</button><h1>@${esc(u.username)}</h1></div><div class="card"><div style="display:flex;gap:16px;align-items:center"><div style="position:relative"><img class="avatar" style="width:86px;height:86px" src="${pic}" onerror="this.style.display='none'" onclick="photoMenu(${own})"></div><div class="grow"><h2 style="margin:0">${esc(u.displayName)}</h2><p class="muted">@${esc(u.username)}</p><div><b>${u.followers||0}</b> followers · <b>${u.following||0}</b> following · <b>${u.posts||0}</b> posts</div></div></div><p>${esc(u.bio)}</p><div class="rowBtns">${own?`<button class="ghost" onclick="go('editprofile')">Edit profile</button>`:`<button class="primary" style="flex:1" onclick="follow('${esc(u.username)}')">Follow</button><button class="ghost" onclick="startChat('${esc(u.id)}','${esc(u.username)}')">Message</button>`}</div></div><div class="empty">Posts from @${esc(u.username)} will appear here.</div></main>`)}catch(e){toast(e.message);go('home')}}
function photoMenu(own){if(!own)return;const c=confirm('OK = Change profile picture\\nCancel = View profile picture');if(c)pickPhoto();else toast('Profile picture opened')}
function pickPhoto(){const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=async()=>{if(!i.files[0])return;const fd=new FormData();fd.append('file',i.files[0]);try{const d=await api('/api/profile/photo',{method:'POST',body:fd});save(d);toast('Profile picture updated');profile(me.username)}catch(e){toast(e.message)}};i.click()}
async function follow(u){try{const d=await api('/api/follow/'+encodeURIComponent(u),{method:'POST'});toast(d.following?'Following @'+u:'Unfollowed @'+u);profile(u)}catch(e){toast(e.message)}}
function search(){shell(`<main class="page"><div class="pageHead"><button class="back" onclick="go('home')">←</button><h1>Search</h1></div><input id="searchBox" class="field" placeholder="Search @username, name, hashtag, sound"><div id="searchResults" class="grid"><div class="empty">Search people and posts.</div></div></main>`);searchBox.oninput=debounce(runSearch,300)}
function debounce(fn,ms){let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>fn(...a),ms)}}async function runSearch(){const q=searchBox.value.trim();if(!q)return;const r=await api('/api/search?q='+encodeURIComponent(q));searchResults.innerHTML=(r.users||[]).map(u=>`<div class="userRow" onclick="openUser('${esc(u.username)}')"><div class="miniAvatar"></div><div class="grow"><b>${esc(u.displayName)}</b><div class="muted">@${esc(u.username)} · ${u.followers||0} followers</div></div></div>`).join('')||'<div class="empty">No results.</div>'}
async function messages(){shell(`<main class="page"><div class="pageHead"><h1>Inbox</h1><button class="iconBtn" onclick="loadNotifications()">♡</button></div><div id="inbox" class="grid"><div class="empty">Loading conversations…</div></div></main>`);const d=await api('/api/messages');inbox.innerHTML=(d.conversations||[]).map(c=>`<div class="userRow" onclick="startChat('${c.peer}','${esc(c.username)}')"><div class="miniAvatar"></div><div class="grow"><b>@${esc(c.username)}</b><div class="muted">${esc(c.last_text||'')}</div></div><span class="pill">${new Date(c.last_at).toLocaleDateString()}</span></div>`).join('')||'<div class="empty">No messages yet. Search for someone and tap Message.</div>'}
function startChat(id,u){chatPeer={id,username:u};route='chat';chat()}
async function chat(){if(!chatPeer)return messages();shell(`<main class="chat"><div class="chatHead"><button class="back" onclick="go('messages')">←</button><div><b>@${esc(chatPeer.username)}</b><div class="muted">Blizz chat</div></div></div><div id="chatMessages" class="chatMessages"></div><div class="composer"><input id="chatInput" class="field" placeholder="Message @${esc(chatPeer.username)}"><button class="primary" onclick="sendMessage()">➤</button></div></main>`,false);await loadChat();window.chatTimer=setInterval(loadChat,2500)}
async function loadChat(){if(route!=='chat')return;const d=await api('/api/messages?with='+encodeURIComponent(chatPeer.id));chatMessages.innerHTML=(d.messages||[]).map(m=>`<div class="bubble ${m.sender_id===me.id?'mine':'theirs'}">${esc(m.text)}</div>`).join('');chatMessages.scrollTop=chatMessages.scrollHeight}
async function sendMessage(){const text=chatInput.value.trim();if(!text)return;try{await api('/api/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to:chatPeer.id,text})});chatInput.value='';loadChat()}catch(e){toast(e.message)}}
async function match(){shell(`<main class="page"><div class="pageHead"><h1>Match</h1></div><div class="grid"><button class="primary" onclick="discover()">⚔ Matching</button><button class="ghost" onclick="go('games')">🎮 Games</button><button class="ghost" onclick="loadMatches()">💞 My matches</button></div><div id="matchArea" style="margin-top:15px"></div></main>`)}
let matchUsers=[],mi=0;async function discover(){const d=await api('/api/match/discover');matchUsers=d.users||[];mi=0;showMatch()}
function showMatch(){const u=matchUsers[mi];if(!u){matchArea.innerHTML='<div class="empty">No more profiles right now.</div>';return}const pic=u.profileMediaId?`/api/media/${u.profileMediaId}`:'';matchArea.innerHTML=`<div class="matchCard"><img src="${pic}" onerror="this.style.display='none'"><div class="matchOverlay"><h2>${esc(u.displayName)}</h2><div class="muted">@${esc(u.username)} · ${esc(u.gender)}</div><p>${esc(u.bio)}</p><div class="matchBtns"><button class="round pass" onclick="matchAction('${u.id}','pass')">×</button><button class="round like" onclick="matchAction('${u.id}','like')">♥</button></div></div></div>`}
async function matchAction(id,a){const d=await api('/api/match/action',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({targetId:id,action:a})});if(d.matched)toast('It’s a match! 💞');mi++;showMatch()}
async function loadMatches(){const d=await api('/api/matches');matchArea.innerHTML=(d.matches||[]).map(m=>`<div class="userRow"><div class="grow"><b>@${esc(m.peer_username)}</b><div class="muted">Matched ${new Date(m.created_at).toLocaleDateString()}</div></div><button class="ghost" onclick="startChat('${m.peer_id}','${esc(m.peer_username)}')">Chat</button></div>`).join('')||'<div class="empty">No matches yet.</div>'}
function games(){shell(`<main class="page"><div class="pageHead"><button class="back" onclick="go('match')">←</button><h1>Games</h1></div><div class="grid"><div class="card"><h2>❤️ Crush</h2><p class="muted">Ask playful questions and compare answers.</p><button class="primary" onclick="localGame('Crush')">Play</button></div><div class="card"><h2>🎯 Would You Rather</h2><button class="primary" onclick="localGame('Would You Rather')">Play</button></div><div class="card"><h2>🎵 Guess the Song</h2><button class="primary" onclick="localGame('Guess the Song')">Play</button></div><div class="card"><h2>🎭 Truth or Dare</h2><button class="primary" onclick="localGame('Truth or Dare')">Play</button></div></div></main>`)}
function localGame(name){const qs={Crush:['What was your first impression of me?','What is your biggest green flag?','Would you ever date your best friend?'], 'Would You Rather':['Be famous or extremely rich?','Read minds or see the future?','Travel everywhere or live in your dream home?'],'Guess the Song':['Which artist released “Lucid Dreams”?','Which artist released “Let Me Down Slowly”?','Which artist released “Perfect”?'],'Truth or Dare':['Truth: What is your biggest crush secret?','Dare: Send a funny selfie.','Truth: What is one thing you never tell people?']}[name]||[];let i=0;const c=confirm(qs[0]||'Game ready');if(c&&qs[1])toast(qs[1])}
function create(){shell(`<main class="camera"><video id="cameraVideo" autoplay muted playsinline></video><div class="camBar"><button class="ghost" onclick="gallery()">Gallery</button><button class="capture" onclick="capture()"> </button><button class="ghost" onclick="flipCamera()">↻ Camera</button></div></main>`,false);startCamera('user')}
async function startCamera(mode){try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:mode},audio:true});cameraVideo.srcObject=stream}catch(e){app.innerHTML=`<main class="center"><div class="card" style="max-width:360px"><h2>Camera permission needed</h2><p class="muted">Blizz needs camera and microphone access. Choose “Allow while using this app” when your device asks.</p><button class="primary" onclick="startCamera('${mode}')">ALLOW CAMERA</button><button class="ghost" style="width:100%;margin-top:8px" onclick="gallery()">Choose from gallery</button></div></main>`}}
async function flipCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());const cur=cameraVideo?.dataset?.facing==='environment'?'user':'environment';if(cameraVideo)cameraVideo.dataset.facing=cur;await startCamera(cur)}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(window.chatTimer){clearInterval(window.chatTimer);window.chatTimer=null}}
function capture(){const v=cameraVideo,c=document.createElement('canvas');c.width=v.videoWidth||720;c.height=v.videoHeight||1280;c.getContext('2d').drawImage(v,0,0,c.width,c.height);c.toBlob(b=>openEditor(b,'image/jpeg'),'image/jpeg',.9)}
function gallery(){const i=document.createElement('input');i.type='file';i.accept='image/*,video/*';i.onchange=()=>i.files[0]&&openEditor(i.files[0],i.files[0].type);i.click()}
function openEditor(blob,type){stopCamera();mediaBlob=blob;const url=URL.createObjectURL(blob);shell(`<main class="page"><div class="pageHead"><button class="back" onclick="go('home')">←</button><h1>Edit & Post</h1></div><div class="preview">${type.startsWith('video/')?`<video src="${url}" controls playsinline></video>`:`<img src="${url}">`}</div><div class="tools"><button class="ghost">Trim</button><button class="ghost">Split</button><button class="ghost">Speed</button><button class="ghost">Freeze</button><button class="ghost">Sound</button><button class="ghost">Effects</button><button class="ghost">Filters</button><button class="ghost">Text</button><button class="ghost">Stickers</button><button class="ghost">Voiceover</button><button class="ghost">Cover</button></div><div class="postForm"><textarea id="caption" class="field" placeholder="Write a caption…"></textarea><select id="visibility" class="field"><option>public</option><option>friends</option></select><button class="primary" onclick="publish('${type}')">POST TO BLIZZ</button></div></main>`)}
async function publish(type){if(!mediaBlob)return;const fd=new FormData();fd.append('file',mediaBlob,type.startsWith('video/')?'blizz-video.webm':'blizz-photo.jpg');fd.append('caption',caption.value);fd.append('visibility',visibility.value);try{await api('/api/posts',{method:'POST',body:fd});toast('Posted — your video is now in Home');go('home')}catch(e){toast(e.message)}}
function editprofile(){shell(`<main class="page"><div class="pageHead"><button class="back" onclick="go('profile')">←</button><h1>Edit Profile</h1></div><div class="card"><button class="ghost" style="width:100%;margin-bottom:10px" onclick="pickPhoto()">Change profile picture</button><input id="edname" class="field" value="${esc(me.displayName)}"><textarea id="edbio" class="field" placeholder="Bio">${esc(me.bio||'')}</textarea><button class="primary" onclick="saveProfile()">SAVE CHANGES</button></div></main>`)}
async function saveProfile(){try{const d=await api('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({displayName:edname.value,bio:edbio.value})});save(d);toast('Profile saved');go('profile')}catch(e){toast(e.message)}}
async function loadNotifications(){const d=await api('/api/notifications');const text=(d.notifications||[]).map(n=>n.message).join('\\n')||'No new notifications';alert(text);await api('/api/notifications/read',{method:'POST'})}
window.addEventListener('beforeunload',stopCamera);render();
</script></body></html>
