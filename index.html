<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blizz</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#090812;color:#fff}.app{min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;padding:14px 16px;background:#0d0b18ee;border-bottom:1px solid #29253d;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:24px;background:linear-gradient(90deg,#61a9ff,#bd6cff,#ff6db5);-webkit-background-clip:text;color:transparent}.page{max-width:760px;margin:auto;padding:18px}.title{font-size:30px;margin:8px 0}.sub,.muted{color:#a6a2b3}.card{background:#121021;border:1px solid #292440;border-radius:20px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:105px;text-align:left}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:13px 15px;background:#1a1730;color:#fff;font-weight:800}button.primary{background:linear-gradient(90deg,#8055ff,#ff4e9a);width:100%}.back{margin-bottom:6px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:#0d0b17f5;border-top:1px solid #29253d}.nav button{background:transparent;border-radius:0;padding:9px 2px;font-size:10px}.nav span{display:block;font-size:19px}.video{height:360px;border-radius:22px;background:linear-gradient(150deg,#21194a,#101827,#38142e);display:flex;align-items:flex-end;padding:18px;margin:12px 0}.pill{display:inline-block;background:#292043;padding:6px 10px;border-radius:99px;font-size:12px}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#17142a;border:1px solid #312b4b}.correct{background:#174d35!important}.wrong{background:#5b2029!important}.progress{height:8px;background:#28243a;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#8055ff,#ff4e9a);width:0}.hidden{display:none}.field{width:100%;padding:13px 14px;margin:7px 0;border-radius:13px;border:1px solid #332d4b;background:#0d0b18;color:#fff;font-size:15px}.linkbtn{background:transparent;padding:8px;color:#b99cff}.error{color:#ff7b9c;font-weight:700;margin:8px 0}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:13px;font-weight:800;z-index:30;display:none}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
let BANK=[],route='home',game=[],qi=0,score=0,answered=false;
const API_BASE=(localStorage.getItem('blizz_api_url')||'').replace(/\/$/,'');
let currentUser=JSON.parse(localStorage.getItem('blizz_user')||'null');
function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});const t=localStorage.getItem('blizz_token');if(t)opts.headers.Authorization='Bearer '+t;return fetch(API_BASE+path,opts).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Request failed');return d})}
function saveSession(d){currentUser=d.user;localStorage.setItem('blizz_user',JSON.stringify(d.user));localStorage.setItem('blizz_token',d.token);}
function logout(){api('/api/logout',{method:'POST'}).catch(()=>{}).finally(()=>{localStorage.removeItem('blizz_user');localStorage.removeItem('blizz_token');currentUser=null;go('auth')})}
function requireAuth(){if(!currentUser){go('auth');return false}return true}
fetch('questions.json').then(r=>r.json()).then(x=>{BANK=x;render()}).catch(()=>{render();toast('Question bank could not load')});
function shell(content){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand">♛ B • Blizz</div><button onclick="go(currentUser?'settings':'auth')">${currentUser?'⚙️':'👤'}</button></header>${content}<nav class="nav"><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('stream')"><span>◉</span>Stream</button><button onclick="go('games')"><span>🎮</span>Games</button><button onclick="go('matchup')"><span>⚔️</span>Matchup</button><button onclick="go('messages')"><span>💬</span>Messages</button><button onclick="go('settings')"><span>⚙️</span>Settings</button></nav></div>`}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1300)}
function go(r){route=r;render()} function back(){go('home')}
function home(){if(!requireAuth())return;shell(`<main class="page"><span class="pill">CONNECT • WATCH • PLAY • CREATE</span><h1 class="title">Welcome to Blizz</h1><p class="sub">Your social video, LIVE, games and messaging space.</p><div class="video"><div><span class="pill">FOR YOU</span><h2>Fresh Blizz videos</h2><p class="muted">Scroll, discover creators and interact with the community.</p><div class="actions"><button onclick="toast('Liked ❤️')">❤️</button><button onclick="go('comments')">💬</button><button onclick="toast('Shared')">↗</button><button onclick="toast('Saved')">🔖</button></div></div></div><div class="grid"><button class="tile" onclick="go('games')">🎮<br>Games<br><small>Play & compete</small></button><button class="tile" onclick="go('stream')">📺<br>Stream<br><small>Watch LIVE</small></button><button class="tile" onclick="go('matchup')">⚔️<br>Matchup<br><small>Find players</small></button><button class="tile" onclick="go('profile')">👤<br>Profile<br><small>View profile</small></button></div></main>`)}
function games(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Games</h1><p class="sub">5,000 questions across the Blizz Games library.</p><div class="grid"><button class="tile" onclick="startGame('all')">🎲<br>Random Mix</button><button class="tile" onclick="startGame('Crush & Love')">❤️<br>Crush & Love</button><button class="tile" onclick="startGame('Best Friends')">👥<br>Best Friends</button><button class="tile" onclick="startGame('Would You Rather')">🤔<br>Would You Rather</button><button class="tile" onclick="startGame('Truth or Dare')">🎯<br>Truth or Dare</button><button class="tile" onclick="startGame('This or That')">⚖️<br>This or That</button><button class="tile" onclick="startGame('Deep & Personal')">💭<br>Deep & Personal</button><button class="tile" onclick="startGame('General Knowledge')">🧠<br>Trivia</button></div><div class="card"><h3>🏆 Leaderboard</h3><button onclick="go('leaderboard')">View Leaderboard</button></div></main>`)}
function startGame(cat){let s=cat==='all'?BANK:BANK.filter(x=>x.cat===cat);game=[...s].sort(()=>Math.random()-.5).slice(0,20);qi=0;score=0;go('quiz')}
function quiz(){let q=game[qi];let isObj=q.type==='objective';shell(`<main class="page"><button class="back" onclick="go('games')">← Games</button><div class="actions" style="justify-content:space-between"><span class="pill">${q.cat}</span><b>Score: ${score}</b></div><div class="progress" style="margin:14px 0"><div class="bar" style="width:${qi/game.length*100}%"></div></div><p class="muted">Question ${qi+1} of ${game.length}</p><div class="card"><h2>${q.q}</h2><div id="choices">${q.options.map((o,i)=>`<button class="choice" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><button id="next" class="primary hidden" style="margin-top:12px" onclick="nextQ()">NEXT ➜</button></div></main>`);answered=false}
function pick(i){if(answered)return;answered=true;let q=game[qi],bs=[...document.querySelectorAll('.choice')];if(q.answer===null){bs[i].classList.add('correct');toast('Choice recorded');}else{if(i===q.answer){score++;bs[i].classList.add('correct');toast('Correct! 🎉')}else{bs[i].classList.add('wrong');bs[q.answer].classList.add('correct');toast('Not quite');}}document.getElementById('next').classList.remove('hidden')}
function nextQ(){qi++;if(qi>=game.length){go('results')}else go('quiz')}
function results(){shell(`<main class="page"><h1 class="title">🏆 Round Complete</h1><div class="card"><h2>${score}/${game.length}</h2><p class="muted">Your Blizz round is complete.</p><div class="actions"><button onclick="startGame('all')">Play Again</button><button onclick="go('games')">More Games</button></div></div></main>`)}
function stream(){if(!requireAuth())return;shell(`<main class="page"><h1 class="title">Stream</h1><p class="sub">Watch LIVE or start your own stream.</p><div class="grid"><button class="tile" onclick="go('live')">📺<br>Watch LIVE</button><button class="tile" onclick="toast('Camera/LIVE setup opens in the full backend')">🔴<br>Start LIVE</button></div><div class="video"><div><span class="pill">LIVE</span><h2>Featured Blizz Stream</h2><button onclick="go('live')">Join Stream</button></div></div></main>`)}
function live(){shell(`<main class="page"><button class="back" onclick="go('stream')">← Stream</button><h1 class="title">LIVE Room</h1><div class="video"><div><span class="pill">LIVE NOW</span><h2>Blizz Live Room</h2><button onclick="toast('Joined LIVE')">Join</button></div></div><div class="actions"><button onclick="toast('❤️ Reaction sent')">❤️</button><button onclick="toast('Shared')">↗ Share</button><button onclick="toast('Reported')">Report</button></div></main>`)}
function matchup(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Matchup</h1><p class="sub">Find someone to chat, play or compete with.</p><div class="card"><h3>⚡ Random Match</h3><button onclick="go('searching')">Find Player</button></div><div class="card"><h3>🟢 Online Players</h3><button onclick="go('online')">See Players</button></div><div class="card"><h3>Choose Activity</h3><div class="actions"><button onclick="toast('Trivia selected')">🧠 Trivia</button><button onclick="toast('Quick Game selected')">⚡ Quick</button><button onclick="toast('Casual selected')">🎮 Casual</button></div></div></main>`)}
function searching(){shell(`<main class="page"><button class="back" onclick="go('matchup')">← Matchup</button><h1 class="title">Finding Player…</h1><div class="card"><p>Searching for an available Blizz player.</p><button onclick="go('lobby')">Simulate Match Found</button></div></main>`)}
function lobby(){shell(`<main class="page"><button class="back" onclick="go('matchup')">← Matchup</button><h1 class="title">Game Lobby</h1><div class="card"><h2>🎮 Trivia Match</h2><p>You vs BlizzPlayer</p><button onclick="startGame('General Knowledge')">Start Match</button></div></main>`)}
function messages(){if(!requireAuth())return;shell(`<main class="page"><h1 class="title">Messages</h1><div class="card"><h3>💬 Friend</h3><p class="muted">Ready for a game?</p><button onclick="go('chat')">Open Chat</button></div></main>`)}
function chat(){shell(`<main class="page"><button class="back" onclick="go('messages')">← Messages</button><h1 class="title">Chat</h1><div class="card"><p>Hey 👋</p><p>Ready for a game?</p><div class="actions"><button onclick="go('games')">🎮 Play</button><button onclick="toast('Message sent')">Send</button></div></div></main>`)}
function profile(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Profile</h1><div class="card"><h2>${currentUser.displayName}</h2><p class="muted">@${currentUser.username}</p><p>${currentUser.bio||'Welcome to my Blizz profile.'}</p><div class="actions"><button onclick="toast('Followed')">Follow</button><button onclick="go('chat')">Message</button><button onclick="go('matchup')">Matchup</button></div></div></main>`)}
function comments(){shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Comments</h1><div class="card"><p>🔥 This is nice!</p><p>Who wants to play trivia?</p><button onclick="toast('Comment posted')">Add Comment</button></div></main>`)}
function settings(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Settings</h1><div class="card"><h3>${currentUser.displayName}</h3><p class="muted">@${currentUser.username} • ${currentUser.email}</p><button onclick="go('profile')">View Profile</button><button onclick="logout()" style="margin-left:8px">Log Out</button></div>${['Account','Privacy','Security','Notifications','Creator Tools','Monetization','Accessibility','Data Saver','Content Preferences'].map(x=>`<button style="width:100%;margin:6px 0;text-align:left" onclick="toast('${x} opened')">${x} ›</button>`).join('')}</main>`)}
function online(){shell(`<main class="page"><button class="back" onclick="go('matchup')">← Matchup</button><h1 class="title">Online Players</h1><div class="card"><b>🟢 BlizzPlayer</b><p class="muted">Looking for Trivia</p><button onclick="go('lobby')">Invite</button></div></main>`)}
function leaderboard(){shell(`<main class="page"><button class="back" onclick="go('games')">← Games</button><h1 class="title">Leaderboard</h1><div class="card"><p>🥇 BlizzPlayer — 98</p><p>🥈 NovaPlayer — 94</p><p>🥉 GameKing — 91</p></div></main>`)}
function auth(){document.getElementById('app').innerHTML=`<div class="app"><main class="page"><div style="text-align:center;margin-top:8vh"><div class="brand" style="font-size:42px">♛ B • Blizz</div><p class="sub">Connect • Watch • Play • Create</p></div><div class="card" id="authCard"><div class="actions" style="justify-content:center"><button id="loginTab" onclick="authMode('login')">Log In</button><button id="signupTab" onclick="authMode('signup')">Create Account</button></div><div id="authForm"></div></div><p class="muted" style="text-align:center;font-size:12px">Your account data is stored by the Blizz backend. Signup does not require NIN, BVN, bank or card details.</p></main></div>`;authMode('login')}
function authMode(mode){const f=document.getElementById('authForm');if(!f)return;f.innerHTML=mode==='login'?`<h2>Welcome back</h2><input id="login" class="field" placeholder="Username or email"><input id="password" type="password" class="field" placeholder="Password"><div id="authError" class="error"></div><button class="primary" onclick="doLogin()">LOG IN</button>`:`<h2>Create your Blizz account</h2><input id="username" class="field" placeholder="Username"><input id="displayName" class="field" placeholder="Display name"><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password (8+ characters)"><input id="dob" class="field" type="date"><select id="gender" class="field"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option></select><div id="authError" class="error"></div><button class="primary" onclick="doSignup()">CREATE ACCOUNT</button>`} 
function doSignup(){const e=document.getElementById('authError');e.textContent='Creating account…';api('/api/signup',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,displayName:document.getElementById('displayName').value,email:document.getElementById('email').value,password:document.getElementById('password').value,dob:document.getElementById('dob').value,gender:document.getElementById('gender').value})}).then(d=>{saveSession(d);toast('Account created 🎉');go('home')}).catch(x=>e.textContent=x.message)}
function doLogin(){const e=document.getElementById('authError');e.textContent='Signing in…';api('/api/login',{method:'POST',body:JSON.stringify({login:document.getElementById('login').value,password:document.getElementById('password').value})}).then(d=>{saveSession(d);toast('Welcome back 👋');go('home')}).catch(x=>e.textContent=x.message)}
function render(){if(!currentUser){auth();return}if(!BANK.length&&route==='quiz')return;({home,games,quiz,results,stream,live,matchup,searching,lobby,messages,chat,profile,comments,settings,online,leaderboard}[route]||home)()}
</script></body></html>
