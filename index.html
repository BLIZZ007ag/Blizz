<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Blizz</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#090812;color:#fff}.app{min-height:100vh;padding-bottom:82px}.top{position:sticky;top:0;z-index:5;padding:14px 16px;background:#0d0b18ee;border-bottom:1px solid #29253d;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:950;font-size:24px;background:linear-gradient(90deg,#61a9ff,#bd6cff,#ff6db5);-webkit-background-clip:text;color:transparent}.page{max-width:760px;margin:auto;padding:18px}.title{font-size:30px;margin:8px 0}.sub,.muted{color:#a6a2b3}.card{background:#121021;border:1px solid #292440;border-radius:20px;padding:17px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{min-height:105px;text-align:left}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:14px;padding:13px 15px;background:#1a1730;color:#fff;font-weight:800}button.primary{background:linear-gradient(90deg,#8055ff,#ff4e9a);width:100%}.back{margin-bottom:6px}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);background:#0d0b17f5;border-top:1px solid #29253d}.nav button{background:transparent;border-radius:0;padding:9px 2px;font-size:10px}.nav span{display:block;font-size:19px}.video{height:360px;border-radius:22px;background:linear-gradient(150deg,#21194a,#101827,#38142e);display:flex;align-items:flex-end;padding:18px;margin:12px 0}.pill{display:inline-block;background:#292043;padding:6px 10px;border-radius:99px;font-size:12px}.choice{display:block;width:100%;text-align:left;margin:9px 0;background:#17142a;border:1px solid #312b4b}.correct{background:#174d35!important}.wrong{background:#5b2029!important}.progress{height:8px;background:#28243a;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#8055ff,#ff4e9a);width:0}.hidden{display:none}.field{width:100%;padding:13px 14px;margin:7px 0;border-radius:13px;border:1px solid #332d4b;background:#0d0b18;color:#fff;font-size:15px}.linkbtn{background:transparent;padding:8px;color:#b99cff}.error{color:#ff7b9c;font-weight:700;margin:8px 0}.settingRow{width:100%;margin:5px 0;text-align:left;display:flex;justify-content:space-between;align-items:center;background:#17142a}.settingToggle{display:flex;justify-content:space-between;align-items:center;padding:15px 0;border-bottom:1px solid #292440}.settingToggle input{width:22px;height:22px}.highContrast{filter:contrast(1.15)}.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:13px;font-weight:800;z-index:30;display:none}

:root{--bg:#08070f;--panel:#12101f;--panel2:#19152b;--line:#2b2544;--text:#f8f7ff;--muted:#aaa5bd;--p1:#7c5cff;--p2:#ff4f9d}
body{font-size:14px;background:radial-gradient(circle at 20% 0%,#21124a 0,#090812 32%,#090812 100%)}
.page{padding:14px;max-width:700px}.title{font-size:24px;letter-spacing:-.3px}.sub,.muted{font-size:13px}
.card{background:linear-gradient(145deg,#151225,#100e1c);border:1px solid #2c2645;border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 10px 30px #0003}
button{font-size:13px;padding:11px 13px;border-radius:13px;background:linear-gradient(145deg,#211b39,#17132a);transition:.15s transform,.15s filter}
button:active{transform:scale(.97);filter:brightness(1.15)}button.primary{background:linear-gradient(90deg,#7656ff,#e94eaa);font-size:13px}
.tile{min-height:92px}.grid{gap:10px}.nav{background:#0b0913f7;backdrop-filter:blur(18px);border-top:1px solid #30294a}.nav button{font-weight:650;color:#b9b3cb}.nav button:active{background:#17132a}.nav span{font-size:18px}
.field{font-size:14px;padding:11px 12px;background:#0c0a14;border-color:#302a48}.settingRow{font-size:13px;padding:12px 13px}
.video{height:330px;background:radial-gradient(circle at 65% 20%,#7136c8,#17152e 48%,#0d1020);overflow:hidden}
.video::after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#ffffff18;border:1px solid #fff4;font-size:20px}
.video{position:relative}.video>div{position:relative;z-index:1}
.pill{font-size:11px;background:linear-gradient(90deg,#34265e,#3b2148);border:1px solid #4b3a72}
.choice{font-size:13px;padding:12px}.choice:hover{background:#211b3b}
.authHero{padding:22px 0 10px;text-align:center}.authHero .brand{font-size:36px}.authCard{background:linear-gradient(145deg,#151126,#0f0d1b);border-radius:24px}
.segment{display:flex;background:#0d0b17;border:1px solid #2b2541;border-radius:15px;padding:4px}.segment button{flex:1;background:transparent}.segment .active{background:linear-gradient(90deg,#684dff,#c34fff);box-shadow:0 4px 14px #7c5cff44}
.feedTabs{position:sticky;top:58px;z-index:4;padding:7px 0;background:#090812e8;backdrop-filter:blur(14px)}
.feedTabs button{background:transparent;padding:8px 10px;color:#aaa5bd}.feedTabs .active{color:#fff;border-bottom:2px solid #a875ff}
.audioCard{background:linear-gradient(145deg,#211544,#111022);border:1px solid #47356d;border-radius:18px;padding:15px}.audioCard audio{width:100%;height:38px;margin:10px 0}.audioPlayer{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#0c0a15;border:1px solid #352b52;border-radius:14px;padding:10px}.audioPlayer{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#0c0a15;border:1px solid #352b52;border-radius:14px;padding:10px}

/* Blizz Creator Experience */
.creatorDock{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:22px;background:#0d0b17ee;border:1px solid #352b50;backdrop-filter:blur(20px);box-shadow:0 10px 35px #0008}.creatorDock .dockBtn{min-width:58px;padding:7px 4px;font-size:10px;color:#c7c0d8;background:transparent}.creatorDock .dockBtn span{display:block;font-size:18px;margin-bottom:2px}.creatorDock .createBtn{width:58px;height:44px;padding:0;border-radius:15px;background:linear-gradient(135deg,#7c5cff,#ff4fa3);font-size:28px;line-height:1;box-shadow:0 7px 20px #7c5cff55}.creatorPage{padding-bottom:120px}.createHero{background:linear-gradient(135deg,#17132a,#24143a 55%,#15192d);border:1px solid #352b50;border-radius:24px;padding:18px}.createGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.createAction{min-height:92px;text-align:left;background:#151226;border:1px solid #302747}.createAction b{font-size:14px}.createAction small{display:block;color:#9e98ad;margin-top:5px}.previewBox{height:220px;border-radius:20px;border:1px dashed #4b4165;background:radial-gradient(circle at 70% 25%,#673bb0,#17132b 52%,#0d1020);display:grid;place-items:center;text-align:center;overflow:hidden}.previewBox img{width:100%;height:100%;object-fit:cover}.songChip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#151226;border:1px solid #302747;border-radius:15px;padding:11px}.miniInput{width:100%;padding:11px 12px;border-radius:12px;background:#0d0b17;color:#fff;border:1px solid #302747;font-size:13px}
@media(max-width:520px){.page{padding:14px}.title{font-size:24px}.card{padding:14px}.createGrid{grid-template-columns:1fr 1fr}}
</style></head><body><div id="app"></div><div id="toast" class="toast"></div><script>
let BANK=[],route='home',game=[],qi=0,score=0,answered=false;
const API_BASE=(localStorage.getItem('blizz_api_url')||'').replace(/\/$/,'');
let currentUser=JSON.parse(localStorage.getItem('blizz_user')||'null');
let prefs=JSON.parse(localStorage.getItem('blizz_prefs')||'{}');
function setPref(k,v){prefs[k]=v;localStorage.setItem('blizz_prefs',JSON.stringify(prefs));toast(k+' updated ✓')}
function getPref(k,d=false){return prefs[k]===undefined?d:prefs[k]}
function videoCard(title,creator,kind='VIDEO'){return `<div class="card"><div class="video" style="height:280px;margin:0 0 12px"><div><span class="pill">${kind}</span><h2>${esc(title)}</h2><p class="muted">@${esc(creator)}</p><button onclick="watchVideo('${esc(title)}')">▶ WATCH</button></div></div><div class="actions"><button onclick="toast('Liked ❤️')">❤️</button><button onclick="go('comments')">💬</button><button onclick="toast('Saved 🔖')">🔖</button><button onclick="toast('Shared ↗')">↗</button></div></div>`}
function watchVideo(title){go('watch');setTimeout(()=>{let el=document.getElementById('watchTitle');if(el)el.textContent=title},0)}
function adCard(label='Sponsored Blizz Ad'){return `<div class="card" style="border-color:#6b4cff"><span class="pill">SPONSORED</span><h3>${label}</h3><p class="muted">A sponsored message can appear here. Test placement only. Real paid ads will appear after Blizz connects an approved ad network.</p><button onclick="go('ad')">▶ WATCH AD</button></div>`}
function api(path,opts={}){opts.headers=Object.assign({'Content-Type':'application/json'},opts.headers||{});const t=localStorage.getItem('blizz_token');if(t)opts.headers.Authorization='Bearer '+t;return fetch(API_BASE+path,opts).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401){localStorage.removeItem('blizz_token');localStorage.removeItem('blizz_user');currentUser=null;throw new Error('Your session expired. Please log in again.')}throw new Error(d.error||'Request failed')}return d})}
function saveSession(d){currentUser=d.user;localStorage.setItem('blizz_user',JSON.stringify(d.user));localStorage.setItem('blizz_token',d.token);}
function logout(){api('/api/logout',{method:'POST'}).catch(()=>{}).finally(()=>{localStorage.removeItem('blizz_user');localStorage.removeItem('blizz_token');currentUser=null;go('auth')})}
function requireAuth(){if(!currentUser){go('auth');return false}return true}
async function validateSession(){if(!currentUser||!localStorage.getItem('blizz_token'))return true;try{let d=await api('/api/me');currentUser=d.user;localStorage.setItem('blizz_user',JSON.stringify(d.user));return true}catch(e){localStorage.removeItem('blizz_user');localStorage.removeItem('blizz_token');currentUser=null;return false}}
validateSession().finally(()=>{fetch('questions.json').then(r=>r.json()).then(x=>{BANK=x;render()}).catch(()=>{render();toast('Question bank could not load')})});
function shell(content){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand">♛ B • Blizz</div><button onclick="go(currentUser?'settings':'auth')">${currentUser?'⚙️':'👤'}</button></header>${content}<nav class="nav"><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('stream')"><span>◉</span>Stream</button><button onclick="go('games')"><span>🎮</span>Games</button><button onclick="go('matchup')"><span>⚔️</span>Matchup</button><button onclick="go('messages')"><span>💬</span>Messages</button><button onclick="go('settings')"><span>⚙️</span>Settings</button></nav><div class="creatorDock"><button class="dockBtn" onclick="go('home')"><span>⌂</span>Home</button><button class="dockBtn" onclick="go('stream')"><span>◉</span>Watch</button><button class="createBtn" onclick="go('create')">+</button><button class="dockBtn" onclick="go('profile')"><span>◯</span>Profile</button><button class="dockBtn" onclick="go('messages')"><span>✉</span>Inbox</button></div></div>`}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1300)}
function go(r){route=r;render()} function back(){go('home')}
function home(){if(!requireAuth())return;shell(`<main class="page"><span class="pill">CONNECT • WATCH • PLAY • CREATE</span><h1 class="title">Blizz Feed</h1><div class="feedTabs"><button class="active" onclick="toast('For You selected')">For You</button><button onclick="toast('Following selected')">Following</button><button onclick="toast('Friends selected')">Friends</button></div>${videoCard('Welcome to Blizz','BlizzOfficial','FEATURED')}${adCard('Blizz Sponsored Video')}${videoCard('Trending on Blizz','BlizzCreator','TRENDING')}<div class="grid"><button class="tile" onclick="go('create')">＋<br>Create<br><small>Play & compete</small></button><button class="tile" onclick="go('stream')">📺<br>Stream<br><small>Watch LIVE</small></button><button class="tile" onclick="go('matchup')">⚔️<br>Matchup<br><small>Find players</small></button><button class="tile" onclick="go('profile')">👤<br>Profile<br><small>View profile</small></button></div></main>`)}
function games(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Games</h1><p class="sub">5,000 questions across the Blizz Games library.</p><div class="grid"><button class="tile" onclick="startGame('all')">🎲<br>Random Mix</button><button class="tile" onclick="startGame('Crush & Love')">❤️<br>Crush & Love</button><button class="tile" onclick="startGame('Best Friends')">👥<br>Best Friends</button><button class="tile" onclick="startGame('Would You Rather')">🤔<br>Would You Rather</button><button class="tile" onclick="startGame('Truth or Dare')">🎯<br>Truth or Dare</button><button class="tile" onclick="startGame('This or That')">⚖️<br>This or That</button><button class="tile" onclick="startGame('Deep & Personal')">💭<br>Deep & Personal</button><button class="tile" onclick="startGame('General Knowledge')">🧠<br>Trivia</button></div><div class="card"><h3>🏆 Leaderboard</h3><button onclick="go('leaderboard')">View Leaderboard</button></div></main>`)}
function startGame(cat){let s=cat==='all'?BANK:BANK.filter(x=>x.cat===cat);game=[...s].sort(()=>Math.random()-.5).slice(0,20);qi=0;score=0;go('quiz')}
function quiz(){let q=game[qi];let isObj=q.type==='objective';shell(`<main class="page"><button class="back" onclick="go('games')">← Games</button><div class="actions" style="justify-content:space-between"><span class="pill">${q.cat}</span><b>Score: ${score}</b></div><div class="progress" style="margin:14px 0"><div class="bar" style="width:${qi/game.length*100}%"></div></div><p class="muted">Question ${qi+1} of ${game.length}</p><div class="card"><h2>${q.q}</h2><div id="choices">${q.options.map((o,i)=>`<button class="choice" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><button id="next" class="primary hidden" style="margin-top:12px" onclick="nextQ()">NEXT ➜</button></div></main>`);answered=false}
function pick(i){if(answered)return;answered=true;let q=game[qi],bs=[...document.querySelectorAll('.choice')];if(q.answer===null){bs[i].classList.add('correct');toast('Choice recorded');}else{if(i===q.answer){score++;bs[i].classList.add('correct');toast('Correct! 🎉')}else{bs[i].classList.add('wrong');bs[q.answer].classList.add('correct');toast('Not quite');}}document.getElementById('next').classList.remove('hidden')}
function nextQ(){qi++;if(qi>=game.length){go('results')}else go('quiz')}
function results(){shell(`<main class="page"><h1 class="title">🏆 Round Complete</h1><div class="card"><h2>${score}/${game.length}</h2><p class="muted">Your Blizz round is complete.</p><div class="actions"><button onclick="startGame('all')">Play Again</button><button onclick="go('games')">More Games</button></div></div></main>`)}
function stream(){if(!requireAuth())return;shell(`<main class="page"><h1 class="title">Stream</h1><p class="sub">Watch Blizz videos, LIVE rooms and sponsored content.</p><div class="grid"><button class="tile" onclick="go('live')">📺<br>Watch LIVE</button><button class="tile" onclick="go('startlive')">🔴<br>Start LIVE</button></div>${videoCard('Featured Blizz Stream','BlizzLive','LIVE NOW')}${adCard('Watch this sponsored message')}${videoCard('Community Spotlight','BlizzCommunity','FEATURED')}<div class="audioCard"><span class="pill">🎧 SONG CHALLENGE</span><h3>Hear the clip — then guess the artist</h3><p class="muted">Listen to the audio first. The answer is revealed only after you choose.</p><div class="audioPlayer"><button onclick="playDemoSong()">🔊 HEAR ORIGINAL DEMO CLIP</button><span class="muted">Voice/audio demo</span></div><div class="actions"><button onclick="go('songquiz')">Start challenge</button></div></div><div class="card"><h3>Movie & Video Feed</h3><p class="muted">When creators publish videos, they will appear here. Blizz does not automatically have licensed movies; creators and rights holders must provide permitted content.</p></div></main>`)}
function playDemoSong(){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance('Blizz in the night, keep it alive. This is an original Blizz demo song.');u.rate=.9;u.pitch=1;speechSynthesis.speak(u);toast('Playing the demo audio 🔊')}else toast('Audio voice is not supported on this device')}
function songquiz(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="go('stream')">← Stream</button><h1 class="title">🎧 Song Challenge</h1><div class="audioCard"><span class="pill">LISTEN FIRST</span><h3>Who performed this song?</h3><p class="muted">Play the clip. Don't read the answer beforehand.</p><div class="audioPlayer"><button onclick="playDemoSong()">🔊 PLAY CLIP</button><span class="muted">Listen first</span></div><div class="choiceArea"><button class="choice" onclick="songPick(this,false)">A. Artist A</button><button class="choice" onclick="songPick(this,true)">B. Demo Artist</button><button class="choice" onclick="songPick(this,false)">C. Artist C</button><button class="choice" onclick="songPick(this,false)">D. Artist D</button></div><p class="muted">Demo clip only. Production Blizz will use licensed music/audio clips.</p></div></main>`)}
function songPick(btn,correct){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);btn.classList.add(correct?'correct':'wrong');toast(correct?'Correct! 🎵':'Not quite — try the next one.')}
function live(){shell(`<main class="page"><button class="back" onclick="go('stream')">← Stream</button><h1 class="title">LIVE Room</h1><div class="video"><div><span class="pill">LIVE NOW</span><h2>Blizz Live Room</h2><p class="muted">Live video infrastructure connects here when streaming is enabled.</p><button onclick="toast('Joined LIVE ✓')">Join</button></div></div><div class="actions"><button onclick="toast('❤️ Reaction sent')">❤️</button><button onclick="toast('Shared ↗')">↗ Share</button><button onclick="toast('Reported ✓')">Report</button></div></main>`)}
function startlive(){shell(`<main class="page"><button class="back" onclick="go('stream')">← Stream</button><h1 class="title">Start LIVE</h1><div class="card"><p>Camera and microphone permissions are required for real LIVE broadcasting.</p><button class="primary" onclick="toast('LIVE setup ready for backend streaming')">CONTINUE</button></div></main>`)}
function watch(){shell(`<main class="page"><button class="back" onclick="go('stream')">← Stream</button><h1 class="title" id="watchTitle">Blizz Video</h1><div class="video" style="height:430px"><div><span class="pill">NOW PLAYING</span><h2>Blizz Video Player</h2><button onclick="toast('Playback started ▶')">▶ PLAY</button></div></div>${adCard('Sponsored message after the video')}<div class="actions"><button onclick="toast('Liked ❤️')">❤️ Like</button><button onclick="go('comments')">💬 Comments</button><button onclick="toast('Saved 🔖')">🔖 Save</button><button onclick="toast('Shared ↗')">↗ Share</button></div></main>`)}
function ad(){shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Sponsored Video</h1><div class="card"><span class="pill">SPONSORED</span><h2>Blizz Ad Preview</h2><p class="muted">This is a Blizz test ad. Real advertiser campaigns will appear here after Blizz connects an approved ad network.</p><div class="progress"><div id="adbar" class="bar" style="width:0%"></div></div><p id="adtime">Ad preview: 10 seconds</p><button id="adskip" disabled>WATCHING…</button></div></main>`);let n=10;let timer=setInterval(()=>{n--;let b=document.getElementById('adbar'),t=document.getElementById('adtime'),btn=document.getElementById('adskip');if(b)b.style.width=((10-n)/10*100)+'%';if(t)t.textContent=n>0?'Ad preview: '+n+' seconds':'Ad complete ✓';if(n<=0){clearInterval(timer);if(btn){btn.disabled=false;btn.textContent='CONTINUE'}}},1000)}
function matchup(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Matchup</h1><p class="sub">Find someone to chat, play or compete with.</p><div class="card"><h3>⚡ Random Match</h3><button onclick="go('searching')">Find Player</button></div><div class="card"><h3>🟢 Online Players</h3><button onclick="go('online')">See Players</button></div><div class="card"><h3>Choose Activity</h3><div class="actions"><button onclick="toast('Trivia selected')">🧠 Trivia</button><button onclick="toast('Quick Game selected')">⚡ Quick</button><button onclick="toast('Casual selected')">🎮 Casual</button></div></div></main>`)}
function searching(){shell(`<main class="page"><button class="back" onclick="go('matchup')">← Matchup</button><h1 class="title">Finding Player…</h1><div class="card"><p>Searching for an available Blizz player.</p><button onclick="go('lobby')">Simulate Match Found</button></div></main>`)}
function lobby(){shell(`<main class="page"><button class="back" onclick="go('matchup')">← Matchup</button><h1 class="title">Game Lobby</h1><div class="card"><h2>🎮 Trivia Match</h2><p>You vs BlizzPlayer</p><button onclick="startGame('General Knowledge')">Start Match</button></div></main>`)}
function messages(){if(!requireAuth())return;shell(`<main class="page"><h1 class="title">Messages</h1><div class="card"><h3>💬 Friend</h3><p class="muted">Ready for a game?</p><button onclick="go('chat')">Open Chat</button></div></main>`)}
function chat(){shell(`<main class="page"><button class="back" onclick="go('messages')">← Messages</button><h1 class="title">Chat</h1><div class="card"><p>Hey 👋</p><p>Ready for a game?</p><div class="actions"><button onclick="go('games')">🎮 Play</button><button onclick="toast('Message sent')">Send</button></div></div></main>`)}
function create(){if(!requireAuth())return;shell(`<main class="page creatorPage"><button class="back" onclick="back()">← Back</button><div class="createHero"><span class="pill">CREATE ON BLIZZ</span><h1 class="title" style="margin-bottom:4px">Make something worth sharing.</h1><p class="sub">Choose a photo or video, add sound, make edits, then publish.</p></div><div class="card"><h3>Start a post</h3><div class="createGrid"><button class="createAction" onclick="chooseMedia()">🎥<br><b>Video</b><small>Record or choose a clip</small></button><button class="createAction" onclick="chooseMedia()">🖼️<br><b>Photo</b><small>Turn pictures into a post</small></button><button class="createAction" onclick="go('profile')">👤<br><b>Profile</b><small>Open your creator page</small></button><button class="createAction" onclick="addSong()">🎵<br><b>Add Sound</b><small>Choose audio for your post</small></button></div></div><div class="card"><h3>Creator studio</h3><div class="previewBox" id="createPreview"><div><div style="font-size:38px">＋</div><p class="muted">Your selected media preview appears here</p></div></div><input id="mediaFile" type="file" accept="image/*,video/*" style="display:none" onchange="previewMedia(this)"><input id="postCaption" class="miniInput" placeholder="Write a caption…" style="margin-top:10px"><div class="songChip" style="margin-top:10px"><span id="selectedSong">🎵 Original sound</span><button onclick="addSong()">Change</button></div><div class="actions" style="margin-top:12px"><button onclick="editMedia()">✨ Edit</button><button onclick="toast('Draft saved')">Save Draft</button><button class="primary" style="width:auto;flex:1" onclick="publishPost()">Post to Blizz</button></div></div></main>`)}
function chooseMedia(){document.getElementById('mediaFile')?.click()} function previewMedia(input){const file=input.files?.[0];if(!file)return;const box=document.getElementById('createPreview');if(file.type.startsWith('image/')){const u=URL.createObjectURL(file);box.innerHTML=`<img src="${u}" alt="Selected photo">`}else if(file.type.startsWith('video/')){const u=URL.createObjectURL(file);box.innerHTML=`<video src="${u}" controls playsinline style="width:100%;height:100%;object-fit:cover"></video>`}toast('Media added ✓')} function addSong(){const name=prompt('Sound name');if(name)document.getElementById('selectedSong').textContent='🎵 '+name} function editMedia(){toast('Blizz editor opened — filters, crop and trim are ready for connection')} function publishPost(){const c=document.getElementById('postCaption')?.value?.trim();toast(c?'Post created ✓':'Post created — add a caption anytime')}
function profile(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Profile</h1><div class="card"><div class="pill">👤 YOUR BLIZZ PROFILE</div><h2>${esc(currentUser.displayName)}</h2><p class="muted">@${esc(currentUser.username)}</p><p>${esc(currentUser.bio||'Welcome to my Blizz profile.')}</p><div class="actions"><button onclick="go('editprofile')">✏️ Edit Profile</button><button onclick="go('chat')">💬 Message</button><button onclick="go('matchup')">⚔️ Matchup</button></div></div><div class="card"><h3>Profile & account</h3><button class="settingRow" onclick="go('editprofile')">Edit profile <span>›</span></button><button class="settingRow" onclick="go('privacy')">Privacy & Security <span>›</span></button><button class="settingRow" onclick="go('notifications')">Notifications <span>›</span></button></div></main>`)}
function editprofile(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="go('profile')">← Profile</button><h1 class="title">Edit Profile</h1><div class="card"><label>Display name</label><input id="editDisplayName" class="field" maxlength="60" value="${attr(currentUser.displayName)}"><label>Bio</label><textarea id="editBio" class="field" maxlength="160" rows="5" placeholder="Tell people about yourself">${esc(currentUser.bio||'')}</textarea><div id="profileError" class="error"></div><button class="primary" onclick="saveProfile()">SAVE PROFILE</button></div></main>`)}
function saveProfile(){const e=document.getElementById('profileError');e.textContent='Saving…';api('/api/profile',{method:'POST',body:JSON.stringify({displayName:document.getElementById('editDisplayName').value,bio:document.getElementById('editBio').value})}).then(d=>{currentUser=d.user;localStorage.setItem('blizz_user',JSON.stringify(currentUser));toast('Profile saved ✓');go('profile')}).catch(x=>e.textContent=x.message)}
function privacy(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">Privacy & Security</h1><div class="card"><button class="settingRow" onclick="go('privacysettings')">Privacy Settings <span>›</span></button><button class="settingRow" onclick="go('blocked')">Blocked Accounts <span>›</span></button><button class="settingRow" onclick="go('security')">Security <span>›</span></button><button class="settingRow" onclick="go('dataprivacy')">Data Privacy <span>›</span></button><button class="settingRow" onclick="go('contentfilter')">Content Filtering <span>›</span></button><button class="settingRow" onclick="go('safety')">Report & Safety Tools <span>›</span></button></div></main>`)}
function privacysettings(){shell(`<main class="page"><button class="back" onclick="go('privacy')">← Privacy & Security</button><h1 class="title">Privacy Settings</h1><div class="card">${[['private','Private account',false],['messages','Allow messages from everyone',true],['comments','Allow comments',true],['mentions','Allow mentions and tags',true],['downloads','Allow video downloads',true]].map(x=>`<label class="settingToggle"><span>${x[1]}</span><input type="checkbox" ${getPref(x[0],x[2])?'checked':''} onchange="setPref('${x[0]}',this.checked)"></label>`).join('')}</div></main>`)}
function blocked(){shell(`<main class="page"><button class="back" onclick="go('privacy')">← Privacy & Security</button><h1 class="title">Blocked Accounts</h1><div class="card"><p class="muted">No blocked accounts yet.</p><button onclick="toast('Block controls will appear from profiles and comments')">How blocking works</button></div></main>`)}
function security(){shell(`<main class="page"><button class="back" onclick="go('privacy')">← Privacy & Security</button><h1 class="title">Security</h1><div class="card"><button class="settingRow" onclick="toast('Password change requires a secure reset endpoint')">Change Password <span>›</span></button><button class="settingRow" onclick="toast('2FA setup requires backend verification')">Two-Factor Authentication <span>›</span></button><button class="settingRow" onclick="go('sessions')">Active Sessions <span>›</span></button></div></main>`)}
function sessions(){shell(`<main class="page"><button class="back" onclick="go('security')">← Security</button><h1 class="title">Active Sessions</h1><div class="card"><p>Current browser session</p><button onclick="logout()">Sign out of this device</button></div></main>`)}
function dataprivacy(){shell(`<main class="page"><button class="back" onclick="go('privacy')">← Privacy & Security</button><h1 class="title">Data Privacy</h1><div class="card"><p>Manage your Blizz profile information and activity.</p><button class="settingRow" onclick="toast('Data request recorded ✓')">Request My Data <span>›</span></button><button class="settingRow" onclick="toast('Account deletion requires confirmation')">Delete Account <span>›</span></button></div></main>`)}
function contentfilter(){shell(`<main class="page"><button class="back" onclick="go('privacy')">← Privacy & Security</button><h1 class="title">Content Filtering</h1><div class="card">${[['sensitive','Filter sensitive content',true],['suggestions','Reduce suggested content',false]].map(x=>`<label class="settingToggle"><span>${x[1]}</span><input type="checkbox" ${getPref(x[0],x[2])?'checked':''} onchange="setPref('${x[0]}',this.checked)"></label>`).join('')}</div></main>`)}
function safety(){shell(`<main class="page"><button class="back" onclick="go('privacy')">← Privacy & Security</button><h1 class="title">Report & Safety</h1><div class="card"><button class="settingRow" onclick="toast('Report form opened')">Report content <span>›</span></button><button class="settingRow" onclick="toast('Safety center opened')">Safety Center <span>›</span></button><button class="settingRow" onclick="toast('Appeal form opened')">Appeals <span>›</span></button></div></main>`)}
function notifications(){shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">Notifications</h1><div class="card">${['likes','followers','messages','mentions','games','matchups','live'].map((k,i)=>{let names=['Likes & comments','New followers','Messages','Mentions & tags','Game invites','Matchup invites','LIVE notifications'];return `<label class="settingToggle"><span>${names[i]}</span><input type="checkbox" ${getPref(k,true)?'checked':''} onchange="setPref('${k}',this.checked)"></label>`}).join('')}</div></main>`)}
function accessibility(){shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">Accessibility</h1><div class="card"><label class="settingToggle"><span>Reduce motion</span><input type="checkbox" ${getPref('motion',false)?'checked':''} onchange="setPref('motion',this.checked);document.documentElement.style.scrollBehavior=this.checked?'auto':'smooth'"></label><label class="settingToggle"><span>Large text</span><input type="checkbox" ${getPref('large',false)?'checked':''} onchange="setPref('large',this.checked);document.body.style.fontSize=this.checked?'18px':''"></label><label class="settingToggle"><span>High contrast</span><input type="checkbox" ${getPref('contrast',false)?'checked':''} onchange="setPref('contrast',this.checked);document.body.classList.toggle('highContrast',this.checked)"></label></div></main>`)}
function appearance(){shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">Appearance</h1><div class="card"><button class="settingRow" onclick="setTheme('dark')">Dark <span>${getPref('theme','dark')==='dark'?'✓':'›'}</span></button><button class="settingRow" onclick="setTheme('light')">Light <span>${getPref('theme','dark')==='light'?'✓':'›'}</span></button><button class="settingRow" onclick="setTheme('system')">System <span>${getPref('theme','dark')==='system'?'✓':'›'}</span></button></div></main>`)}
function setTheme(t){setPref('theme',t);document.body.style.background=t==='light'?'#f7f7fb':'#090812';document.body.style.color=t==='light'?'#111':'#fff';go('appearance')}
function dataSaver(){shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">Data Saver</h1><div class="card"><label class="settingToggle"><span>Use less mobile data</span><input type="checkbox" ${getPref('dataSaver',false)?'checked':''} onchange="setPref('dataSaver',this.checked)"></label></div></main>`)}
function contentPrefs(){shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">Content Preferences</h1><div class="card"><button class="settingRow" onclick="go('contentfilter')">Sensitive content <span>›</span></button><button class="settingRow" onclick="toast('Interest controls opened')">Manage interests <span>›</span></button></div></main>`)}
function help(){shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">Help & Support</h1><div class="card"><button class="settingRow" onclick="toast('FAQ opened')">FAQs <span>›</span></button><button class="settingRow" onclick="toast('Support request opened')">Contact support <span>›</span></button></div></main>`)}
function about(){shell(`<main class="page"><button class="back" onclick="go('settings')">← Settings</button><h1 class="title">About Blizz</h1><div class="card"><h2>Blizz</h2><p>Connect • Watch • Play • Create</p><p class="muted">Blizz web test build. More production services are still being connected.</p></div></main>`)}
function comments(){shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Comments</h1><div class="card"><p>🔥 This is nice!</p><p>Who wants to play trivia?</p><button onclick="toast('Comment posted')">Add Comment</button></div></main>`)}
function settings(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Settings</h1><div class="card"><h3>${esc(currentUser.displayName)}</h3><p class="muted">@${esc(currentUser.username)} • ${esc(currentUser.email||'')}</p><button onclick="go('profile')">View Profile</button><button onclick="go('editprofile')" style="margin-left:8px">Edit Profile</button><button onclick="logout()" style="margin-left:8px">Log Out</button></div><div class="card"><h3>Account</h3><button class="settingRow" onclick="go('profile')">Profile <span>›</span></button><button class="settingRow" onclick="go('privacy')">Privacy & Security <span>›</span></button><button class="settingRow" onclick="go('notifications')">Notifications <span>›</span></button></div><div class="card"><h3>App</h3><button class="settingRow" onclick="go('accessibility')">Accessibility <span>›</span></button><button class="settingRow" onclick="go('dataSaver')">Data Saver <span>›</span></button><button class="settingRow" onclick="go('contentPrefs')">Content Preferences <span>›</span></button><button class="settingRow" onclick="go('appearance')">Appearance <span>›</span></button><button class="settingRow" onclick="go('help')">Help & Support <span>›</span></button><button class="settingRow" onclick="go('about')">About Blizz <span>›</span></button></div></main>`)}
function online(){shell(`<main class="page"><button class="back" onclick="go('matchup')">← Matchup</button><h1 class="title">Online Players</h1><div class="card"><b>🟢 BlizzPlayer</b><p class="muted">Looking for Trivia</p><button onclick="go('lobby')">Invite</button></div></main>`)}
function leaderboard(){shell(`<main class="page"><button class="back" onclick="go('games')">← Games</button><h1 class="title">Leaderboard</h1><div class="card"><p>🥇 BlizzPlayer — 98</p><p>🥈 NovaPlayer — 94</p><p>🥉 GameKing — 91</p></div></main>`)}
function auth(){document.getElementById('app').innerHTML=`<div class="app"><main class="page"><div class="authHero"><div class="brand">♛ B • Blizz</div><p class="sub">Connect • Watch • Play • Create</p></div><div class="card authCard" id="authCard"><div class="segment"><button id="loginTab" onclick="authMode('login')">Log In</button><button id="signupTab" onclick="authMode('signup')">Create Account</button></div><div id="authForm"></div></div><p class="muted" style="text-align:center;font-size:12px">Create your Blizz account with basic profile information.</p></main></div>`;authMode('login')}
function authMode(mode){const f=document.getElementById('authForm');if(!f)return;document.getElementById('loginTab')?.classList.toggle('active',mode==='login');document.getElementById('signupTab')?.classList.toggle('active',mode==='signup');f.innerHTML=mode==='login'?`<h2>Welcome back</h2><input id="login" class="field" placeholder="Username or email"><input id="password" type="password" class="field" placeholder="Password"><div id="authError" class="error"></div><button class="primary" onclick="doLogin()">LOG IN</button>`:`<h2>Create your Blizz account</h2><input id="username" class="field" placeholder="Username"><input id="displayName" class="field" placeholder="Display name"><input id="email" class="field" type="email" placeholder="Email"><input id="password" class="field" type="password" placeholder="Password (8+ characters)"><input id="dob" class="field" type="date"><select id="gender" class="field"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option></select><div id="authError" class="error"></div><button class="primary" onclick="doSignup()">CREATE ACCOUNT</button>`} 
function doSignup(){const e=document.getElementById('authError');e.textContent='Creating account…';api('/api/signup',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,displayName:document.getElementById('displayName').value,email:document.getElementById('email').value,password:document.getElementById('password').value,dob:document.getElementById('dob').value,gender:document.getElementById('gender').value})}).then(d=>{saveSession(d);toast('Account created 🎉');go('home')}).catch(x=>e.textContent=x.message)}
function doLogin(){const e=document.getElementById('authError');e.textContent='Signing in…';api('/api/login',{method:'POST',body:JSON.stringify({login:document.getElementById('login').value,password:document.getElementById('password').value})}).then(d=>{saveSession(d);toast('Welcome back 👋');go('home')}).catch(x=>e.textContent=x.message)}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v)}
function render(){if(!currentUser){auth();return}if(!BANK.length&&route==='quiz')return;({home,create,games,quiz,results,stream,songquiz,live,startlive,watch,ad,matchup,searching,lobby,messages,chat,profile,editprofile,comments,settings,privacy,privacysettings,blocked,security,sessions,dataprivacy,contentfilter,safety,notifications,accessibility,appearance,dataSaver,contentPrefs,help,about,online,leaderboard}[route]||home)()}
</script></body></html>
