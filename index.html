function safeJSON(key,fallback){try{const v=localStorage.getItem(key);return v?JSON.parse(v):fallback}catch(e){localStorage.removeItem(key);return fallback}}
const API_BASE=(localStorage.getItem('blizz_api_url')||'').replace(/\/$/,'');

function getPref(k,d=false){return prefs[k]===undefined?d:prefs[k]}
function videoCard(title,creator,kind='VIDEO'){return `<div class="card"><div class="feedHeader"><div class="avatar">${esc((creator||'B')[0].toUpperCase())}</div><div class="feedMeta"><b>${esc(creator)}</b><small>@${esc(creator)} · ${kind}</small></div><button onclick="followUser('${esc(creator)}')">Follow</button></div><div class="video" style="height:330px;margin:0 0 12px"><div><span class="pill">${kind}</span><h2>${esc(title)}</h2><button onclick="watchVideo('${esc(title)}')">▶ WATCH</button></div></div><div class="actions"><button onclick="toast('Liked ❤️')">❤️ Like</button><button onclick="go('comments')">💬 Comment</button><button onclick="toast('Saved 🔖')">🔖 Save</button><button onclick="toast('Shared ↗')">↗ Share</button></div></div>`}
function renderPost(p){const isVideo=p.mediaType.startsWith('video/');return `<article class="card feedPost"><div class="feedHeader"><div class="avatar">${esc((p.displayName||p.username||'B')[0].toUpperCase())}</div><div class="feedMeta"><b>${esc(p.displayName||p.username)}</b><small>@${esc(p.username)}</small></div><button onclick="followUser('${esc(p.username)}')">Follow</button></div>${isVideo?`<video class="postVideo" src="${attr(p.mediaUrl)}" controls playsinline preload="metadata"></video>`:`<img class="postVideo" src="${attr(p.mediaUrl)}" alt="Blizz post">`}<div class="caption">${esc(p.caption)}</div>${p.soundName?`<div class="soundLine">🎵 ${esc(p.soundName)}</div>`:''}<div class="actions"><button onclick="toast('Liked ❤️')">❤️</button><button onclick="go('comments')">💬</button><button onclick="toast('Saved 🔖')">🔖</button><button onclick="navigator.share?navigator.share({title:'Blizz',url:location.href}):toast('Share link copied')">↗</button></div></article>`}
async function loadFeed(mode='foryou'){const box=document.getElementById('liveFeed');if(!box)return;box.innerHTML='<div class="card"><p class="muted">Loading your feed…</p></div>';try{const d=await api('/api/posts?mode='+encodeURIComponent(mode));box.innerHTML=d.posts.length?d.posts.map(renderPost).join(''):`<div class="card"><h3>Your ${mode==='following'?'Following':'Blizz'} feed is ready.</h3><p class="muted">Post your first video and it will appear here.</p><button class="primary" onclick="go('create')">＋ Create a video</button></div>`}catch(e){box.innerHTML='<div class="card"><p class="error">Could not load the feed. '+esc(e.message)+'</p></div>'}}
function selectFeedTab(mode,btn){document.querySelectorAll('.feedTabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active');loadFeed(mode)}

function adCard(label='Sponsored Blizz Ad'){return `<div class="card" style="border-color:#6b4cff"><span class="pill">SPONSORED</span><h3>${label}</h3><p class="muted">Sponsored content from Blizz partners can appear here.</p><button onclick="go('ad')">▶ WATCH AD</button></div>`}
function api(path,opts={}){opts.headers=Object.assign({},opts.headers||{});if(!(opts.body instanceof FormData))opts.headers['Content-Type']='application/json';const t=localStorage.getItem('blizz_token');if(t)opts.headers.Authorization='Bearer '+t;return fetch(API_BASE+path,opts).then(async r=>{const d=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401){const authRequest=path.startsWith('/api/login')||path.startsWith('/api/signup');if(!authRequest){localStorage.removeItem('blizz_token');localStorage.removeItem('blizz_user');currentUser=null}throw new Error(d.error||(authRequest?'Unable to sign in.':'Your session expired. Please log in again.'))}throw new Error(d.error||'Request failed')}return d})}
function saveSession(d){currentUser=d.user;localStorage.setItem('blizz_user',JSON.stringify(d.user));localStorage.setItem('blizz_token',d.token);}
function logout(){api('/api/logout',{method:'POST'}).catch(()=>{}).finally(()=>{localStorage.removeItem('blizz_user');localStorage.removeItem('blizz_token');currentUser=null;go('auth')})}
function requireAuth(){if(!currentUser){go('auth');return false}return true}
async function validateSession(){if(!currentUser||!localStorage.getItem('blizz_token'))return true;try{let d=await api('/api/me');currentUser=d.user;localStorage.setItem('blizz_user',JSON.stringify(d.user));return true}catch(e){localStorage.removeItem('blizz_user');localStorage.removeItem('blizz_token');currentUser=null;return false}}
validateSession().finally(()=>{fetch('questions.json').then(r=>r.json()).then(x=>{BANK=x;render()}).catch(()=>{render();toast('Question bank could not load')})});
function shell(content){document.getElementById('app').innerHTML=`<div class="app"><header class="top"><div class="brand">♛ B • Blizz</div><button onclick="go(currentUser?'settings':'auth')">${currentUser?'⚙️':'👤'}</button></header>${content}<nav class="nav"><button onclick="go('home')"><span>⌂</span>Home</button><button onclick="go('stream')"><span>◉</span>Stream</button><button onclick="go('games')"><span>🎮</span>Games</button><button onclick="go('matchup')"><span>⚔️</span>Matchup</button><button onclick="go('messages')"><span>💬</span>Messages</button><button onclick="go('wallet')"><span>🪙</span>Wallet</button><button onclick="go('settings')"><span>⚙️</span>Settings</button></nav><div class="creatorDock"><button class="dockBtn" onclick="go('home')"><span>⌂</span>Home</button><button class="dockBtn" onclick="go('stream')"><span>◉</span>Watch</button><button class="createBtn" onclick="go('create')">+</button><button class="dockBtn" onclick="go('profile')"><span>◯</span>Profile</button><button class="dockBtn" onclick="go('messages')"><span>✉</span>Inbox</button></div></div>`}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1300)}
function go(r){route=r;render();if(r==='profile')setTimeout(loadProfileVideos,50)} function back(){go('home')}
function home(){if(!requireAuth())return;shell(`<main class="page"><span class="pill">CONNECT • WATCH • PLAY • CREATE</span><h1 class="title">Blizz Feed</h1><div class="feedTabs"><button class="active" onclick="selectFeedTab('foryou',this)">For You</button><button onclick="selectFeedTab('following',this)">Following</button><button onclick="selectFeedTab('friends',this)">Friends</button></div><section id="liveFeed"></section><div class="grid"><button class="tile" onclick="go('create')">＋<br>Create<br><small>Post a video</small></button><button class="tile" onclick="go('stream')">📺<br>Stream<br><small>Watch LIVE</small></button><button class="tile" onclick="go('matchup')">⚔️<br>Matchup<br><small>Find players</small></button><button class="tile" onclick="go('profile')">👤<br>Profile<br><small>Your videos</small></button></div></main>`);loadFeed('foryou')}
function games(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Games</h1><p class="sub">5,000 questions across the Blizz Games library.</p><div class="grid"><button class="tile" onclick="startGame('all')">🎲<br>Random Mix</button><button class="tile" onclick="startGame('Crush & Love')">❤️<br>Crush & Love</button><button class="tile" onclick="startGame('Best Friends')">👥<br>Best Friends</button><button class="tile" onclick="startGame('Would You Rather')">🤔<br>Would You Rather</button><button class="tile" onclick="startGame('Truth or Dare')">🎯<br>Truth or Dare</button><button class="tile" onclick="startGame('This or That')">⚖️<br>This or That</button><button class="tile" onclick="startGame('Deep & Personal')">💭<br>Deep & Personal</button><button class="tile" onclick="startGame('General Knowledge')">🧠<br>Trivia</button></div><div class="card"><h3>🏆 Leaderboard</h3><button onclick="go('leaderboard')">View Leaderboard</button></div></main>`)}
function startGame(cat){let s=cat==='all'?BANK:BANK.filter(x=>x.cat===cat);game=[...s].sort(()=>Math.random()-.5).slice(0,20);qi=0;score=0;go('quiz')}
function quiz(){let q=game[qi];let isObj=q.type==='objective';shell(`<main class="page"><button class="back" onclick="go('games')">← Games</button><div class="actions" style="justify-content:space-between"><span class="pill">${q.cat}</span><b>Score: ${score}</b></div><div class="progress" style="margin:14px 0"><div class="bar" style="width:${qi/game.length*100}%"></div></div><p class="muted">Question ${qi+1} of ${game.length}</p><div class="card"><h2>${q.q}</h2><div id="choices">${q.options.map((o,i)=>`<button class="choice" onclick="pick(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><button id="next" class="primary hidden" style="margin-top:12px" onclick="nextQ()">NEXT ➜</button></div></main>`);answered=false}
function pick(i){if(answered)return;answered=true;let q=game[qi],bs=[...document.querySelectorAll('.choice')];if(q.answer===null){bs[i].classList.add('correct');toast('Choice recorded');}else{if(i===q.answer){score++;bs[i].classList.add('correct');toast('Correct! 🎉')}else{bs[i].classList.add('wrong');bs[q.answer].classList.add('correct');toast('Not quite');}}document.getElementById('next').classList.remove('hidden')}
function nextQ(){qi++;if(qi>=game.length){go('results')}else go('quiz')}
function results(){shell(`<main class="page"><h1 class="title">🏆 Round Complete</h1><div class="card"><h2>${score}/${game.length}</h2><p class="muted">Your Blizz round is complete.</p><div class="actions"><button onclick="startGame('all')">Play Again</button><button onclick="go('games')">More Games</button></div></div></main>`)}
function stream(){if(!requireAuth())return;shell(`<main class="page"><h1 class="title">Stream</h1><p class="sub">Watch Blizz videos, LIVE rooms and sponsored content.</p><div class="grid"><button class="tile" onclick="go('live')">📺<br>Watch LIVE</button><button class="tile" onclick="go('startlive')">🔴<br>Start LIVE</button></div>${videoCard('Featured Blizz Stream','BlizzLive','LIVE NOW')}${adCard('Watch this sponsored message')}${videoCard('Community Spotlight','BlizzCommunity','FEATURED')}<div class="audioCard"><span class="pill">🎧 SONG CHALLENGE</span><h3>Hear the track — then guess the artist</h3><p class="muted">Listen first. Then choose the artist you think performed it.</p><div class="audioPlayer"><button onclick="playBlizzTrack()">▶ PLAY BLIZZ TRACK</button><span class="muted">Original Blizz music</span></div><div class="actions"><button onclick="go('songquiz')">Start challenge</button></div></div><div class="card"><h3>Movie & Video Feed</h3><p class="muted">When creators publish videos, they will appear here. Blizz does not automatically have licensed movies; creators and rights holders must provide permitted content.</p></div></main>`)}
let musicCtx=null,musicTimer=null;
function stopBlizzMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}if(musicCtx){musicCtx.close().catch(()=>{});musicCtx=null}}
function playBlizzTrack(){try{stopBlizzMusic();const C=window.AudioContext||window.webkitAudioContext;if(!C){toast('Audio is not supported on this device');return}musicCtx=new C();const ctx=musicCtx,master=ctx.createGain();master.gain.value=.1;master.connect(ctx.destination);const notes=[261.63,329.63,392,523.25,392,329.63,293.66,349.23,440,587.33,440,349.23];let i=0;function beat(){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=notes[i%notes.length];g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.18,ctx.currentTime+.03);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.4);o.connect(g);g.connect(master);o.start();o.stop(ctx.currentTime+.42);i++}beat();musicTimer=setInterval(beat,430);toast('Playing Blizz Night 🎵')}catch(e){toast('Could not start audio')}}
function songquiz(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="go('stream')">← Stream</button><h1 class="title">🎧 Song Challenge</h1><div class="audioCard"><span class="pill">LISTEN FIRST</span><h3>Who performed this song?</h3><p class="muted">Play the clip. Don't read the answer beforehand.</p><div class="audioPlayer"><button onclick="playBlizzTrack()">🔊 PLAY CLIP</button><span class="muted">Listen first</span></div><div class="choiceArea"><button class="choice" onclick="songPick(this,false)">A. Alec Benjamin</button><button class="choice" onclick="songPick(this,true)">B. Blizz Original</button><button class="choice" onclick="songPick(this,false)">C. Juice WRLD</button><button class="choice" onclick="songPick(this,false)">D. Ed Sheeran</button></div><p class="muted">Blizz music library</p></div></main>`)}
function songPick(btn,correct){document.querySelectorAll('.choice').forEach(x=>x.disabled=true);btn.classList.add(correct?'correct':'wrong');toast(correct?'Correct! 🎵':'Not quite — try the next one.')}

function matchup(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Matchup</h1><p class="sub">Find someone to chat, play or compete with.</p><div class="card"><h3>⚡ Random Match</h3><button onclick="go('searching')">Find Player</button></div><div class="card"><h3>🟢 Online Players</h3><button onclick="go('online')">See Players</button></div><div class="card"><h3>Choose Activity</h3><div class="actions"><button onclick="toast('Trivia selected')">🧠 Trivia</button><button onclick="toast('Quick Game selected')">⚡ Quick</button><button onclick="toast('Casual selected')">🎮 Casual</button></div></div></main>`)}

function create(){if(!requireAuth())return;window.createState={file:null,sound:null,soundName:'',speed:1,start:0,end:100,originalVolume:1,musicVolume:.8,overlayText:'',effects:[],splitPoints:[],filter:'none'};document.getElementById('app').innerHTML=`<div class="creatorScreen"><div class="creatorBar"><button onclick="go('home')">✕</button><b>Create</b><button onclick="saveDraftLocal()">Save draft</button></div><div class="creatorStage" id="mediaStage"><div class="empty"><div style="font-size:54px">＋</div><p>Select a video or photo</p><button class="primary" onclick="document.getElementById('mediaFile').click()">Choose from device</button></div></div><input id="mediaFile" type="file" accept="video/*,image/*" style="display:none" onchange="loadCreatorMedia(this)"><input id="soundFile" type="file" accept="audio/*" style="display:none" onchange="loadCreatorSound(this)"><div class="creatorBottom"><div class="creatorTools2"><button onclick="document.getElementById('mediaFile').click()">🎥<br>Media</button><button onclick="openClipEditor()">✂️<br>Edit</button><button onclick="openSoundEditor()">🎵<br>Sound</button><button onclick="openPostSheet()">📝<br>Details</button><button onclick="publishPost()" class="primary">Post</button></div></div></div>`}

function editclip(){const st=window.createState;if(!st?.file){go('create');return}const u=URL.createObjectURL(st.file);document.getElementById('app').innerHTML=`<div class="editorPage"><div class="editorTop"><button class="iconBtn" onclick="go('create')">←</button><div class="editorTitle">Edit video</div><div class="editorTopActions"><button class="iconBtn" onclick="editorUndo()">↶</button><button class="iconBtn" onclick="editorRedo()">↷</button></div></div><div class="editorBody"><div class="editorPreview" id="editorPreview"><span class="previewBadge">BLIZZ EDITOR</span><video id="editorVideo" src="${u}" playsinline controls></video><div id="editorOverlay" class="editorOverlay"></div></div><div class="editorControls"><div class="editorTimelineWrap"><div class="editorTimelineHead"><span>Timeline</span><span id="editorTime">00:00</span></div><div class="editorTimelinePro" id="editorTimelinePro"><div class="editorFilm">${Array.from({length:12},()=>'<i></i>').join('')}</div><div class="editorRange"></div><div class="editorPlayhead" id="editorPlayhead"></div></div></div><div class="editorToolRail" id="editorToolRail"><button class="editorTool" data-tool="sound" onclick="editorTool('sound')"><span>🎵</span>Sound</button><button class="editorTool" data-tool="text" onclick="editorTool('text')"><span>Aa</span>Text</button><button class="editorTool" data-tool="stickers" onclick="editorTool('stickers')"><span>☺</span>Stickers</button><button class="editorTool" data-tool="effects" onclick="editorTool('effects')"><span>✦</span>Effects</button><button class="editorTool" data-tool="filters" onclick="editorTool('filters')"><span>◐</span>Filters</button><button class="editorTool" data-tool="speed" onclick="editorTool('speed')"><span>1×</span>Speed</button><button class="editorTool" data-tool="trim" onclick="editorTool('trim')"><span>✂</span>Trim</button><button class="editorTool" data-tool="split" onclick="editorTool('split')"><span>▥</span>Split</button><button class="editorTool" data-tool="volume" onclick="editorTool('volume')"><span>🔊</span>Volume</button><button class="editorTool" data-tool="voice" onclick="editorTool('voice')"><span>🎙</span>Voice</button></div><div class="editorPanel" id="editorPanel"><div class="panelHead"><h3>Choose an editing tool</h3><span class="editorHint">Blizz • Create your way</span></div><p class="editorHint">Tap Sound, Text, Stickers, Effects, Filters, Speed or Trim to edit this clip.</p></div><div class="editorBottomBar"><button onclick="go('create')">Cancel</button><button class="done" onclick="applyEditorAndBack()">Done ✓</button></div></div></div></div>`;buildThumbs();const v=document.getElementById('editorVideo');v?.addEventListener('timeupdate',()=>{if(v.duration){document.getElementById('editorTime').textContent=fmtEditorTime(v.currentTime);document.getElementById('editorPlayhead').style.left=(v.currentTime/v.duration*100)+'%'}});v?.addEventListener('loadedmetadata',()=>{if(st.end===100)st.end=100});}
function fmtEditorTime(n){n=Math.max(0,Number(n)||0);const m=Math.floor(n/60),s=Math.floor(n%60);return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}

function editorTool(t){markEditorTool(t);const p=document.getElementById('editorPanel'),st=window.createState,v=document.getElementById('editorVideo');if(!p)return;if(t==='sound')p.innerHTML=`<div class="panelHead"><h3>🎵 Sound</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><div class="soundSearch"><input class="field" placeholder="Search sounds" oninput="filterSounds(this.value)"></div><div class="soundChips"><button class="soundChipBtn selected">For you</button><button class="soundChipBtn">Trending</button><button class="soundChipBtn">Favorites</button></div><div id="soundList"></div>${soundLibraryMarkup()}<button onclick="document.getElementById('soundFile').click()">＋ Upload from device</button><div id="soundLabel" class="editorHint">${st.soundName?'Selected: '+esc(st.soundName):'Choose a sound, then adjust its volume.'}</div>`;else if(t==='text')p.innerHTML=`<div class="panelHead"><h3>Aa Text</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><input id="editText" class="field" maxlength="120" placeholder="Type text"><div class="textStyles"><button class="textStyle" onclick="setTextStyle('classic')"><b>Aa</b>Classic</button><button class="textStyle" onclick="setTextStyle('bold')"><b style="font-weight:1000">Aa</b>Bold</button><button class="textStyle" onclick="setTextStyle('type')"><b style="font-family:monospace">Aa</b>Type</button><button class="textStyle" onclick="setTextStyle('neon')"><b style="text-shadow:0 0 10px #fff">Aa</b>Glow</button></div><div class="editorPanelRow"><button onclick="setEditorText('top')">Top</button><button onclick="setEditorText('center')">Center</button><button onclick="setEditorText('bottom')">Bottom</button></div>`;else if(t==='stickers')p.innerHTML=`<div class="panelHead"><h3>☺ Stickers</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><div class="stickerGrid">${['❤️','😂','🔥','😍','✨','👑','💯','🎉','🥶','😎','💜','⭐'].map(x=>`<button onclick="addSticker('${x}')">${x}</button>`).join('')}</div><p class="editorHint">Tap a sticker to place it on the preview.</p>`;else if(t==='effects')p.innerHTML=`<div class="panelHead"><h3>✦ Effects</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><div class="effectGrid">${['None','Glow','Vivid','Warm','Cool','Dream','Blur','Shake','Flash'].map(x=>`<button class="${st.effects.includes(x)?'selected':''}" onclick="setEffect('${x}')">${x}</button>`).join('')}</div>`;else if(t==='filters')p.innerHTML=`<div class="panelHead"><h3>◐ Filters</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><div class="filterGrid">${['None','Vivid','Warm','Cool','Fade','B&W'].map(x=>`<button class="filterBtn ${st.filter===x?'selected':''}" onclick="setFilter('${x}')">${x}</button>`).join('')}</div>`;else if(t==='speed')p.innerHTML=`<div class="panelHead"><h3>Speed</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><div class="speedGrid">${[.3,.5,.75,1,1.25,1.5,2,3,4].map(x=>`<button class="${st.speed===x?'selected':''}" onclick="setEditorSpeed(${x})">${x}×</button>`).join('')}</div><p class="editorHint">Preview speed changes instantly. Final export uses the selected speed.</p>`;else if(t==='trim')p.innerHTML=`<div class="panelHead"><h3>✂ Trim</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><div class="trimTrack"><div id="trimLeft" class="trimHandle left"></div><div id="trimRight" class="trimHandle right"></div></div><p class="toolNote">Start: <b id="startVal">${st.start}%</b> · End: <b id="endVal">${st.end}%</b></p><input class="range" type="range" min="0" max="99" value="${st.start}" oninput="setTrimStart(this.value)"><input class="range" type="range" min="1" max="100" value="${st.end}" oninput="setTrimEnd(this.value)"><p class="editorHint">Drag the handles to keep only the section you want.</p>`;else if(t==='split')p.innerHTML=`<div class="panelHead"><h3>▥ Split</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><p class="toolNote">Move the playhead in the preview, then add a split point.</p><input class="range" type="range" min="1" max="99" value="50" oninput="document.getElementById('splitPct').textContent=this.value+'%';createState.splitPoints=[Number(this.value)]"><div class="rangeValue" id="splitPct">50%</div><button class="primary" onclick="toast('Split point added ✓')">Split at playhead</button>`;else if(t==='volume')p.innerHTML=`<div class="panelHead"><h3>🔊 Volume</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><div class="volumeRow"><span>Original</span><input class="range" type="range" min="0" max="1" step=".01" value="${st.originalVolume}" oninput="createState.originalVolume=Number(this.value);if(editorVideo)editorVideo.volume=Number(this.value)"></div><div class="volumeRow"><span>Added sound</span><input class="range" type="range" min="0" max="1" step=".01" value="${st.musicVolume}" oninput="createState.musicVolume=Number(this.value);if(creatorSoundPreview)creatorSoundPreview.volume=Number(this.value)"></div><p class="editorHint">Mix your original audio and added sound independently.</p>`;else if(t==='voice')p.innerHTML=`<div class="panelHead"><h3>🎙 Voiceover</h3><button class="panelClose" onclick="closeEditorPanel()">Done</button></div><button class="primary" onclick="startVoiceover()">● Start voiceover</button><p class="editorHint">Record narration over the video. The recorded track can be included in the final media-processing pipeline.</p>`;if(t==='sound')renderSoundList?.()}
function closeEditorPanel(){markEditorTool('');const p=document.getElementById('editorPanel');if(p)p.innerHTML='<div class="panelHead"><h3>Choose an editing tool</h3><span class="editorHint">Blizz • Create your way</span></div>'}
function setTextStyle(x){toast('Text style: '+x);const o=document.getElementById('editorOverlay');if(o)o.style.fontWeight=x==='bold'?'1000':'800'}

function soundLibraryMarkup(){return `<div id="soundLibrary" class="soundList">${['Blizz Night','Blizz Spark','Blizz Love','Blizz Chill'].map(x=>`<div class="soundRow"><span>🎵 ${x}</span><button onclick="selectBlizzSound('${x}')">Use</button></div>`).join('')}</div>`}
function filterSounds(q){document.querySelectorAll('#soundLibrary .soundRow').forEach(r=>r.style.display=r.textContent.toLowerCase().includes((q||'').toLowerCase())?'flex':'none')}
function renderSoundList(){}
function selectBlizzSound(name){createState.sound=null;createState.soundName=name;const l=document.getElementById('soundLabel');if(l)l.textContent='Selected: '+name;toast(name+' selected')}
function setEditorText(pos){const input=document.getElementById('editText');const o=document.getElementById('editorOverlay');if(!input||!o)return;createState.overlayText=input.value;o.textContent=input.value;o.style.top=pos==='top'?'16%':pos==='bottom'?'82%':'50%'}
function addSticker(x){const o=document.getElementById('editorOverlay');if(o)o.textContent+=x}
function setEffect(x){createState.effects=x==='None'?[]:[x];const v=document.getElementById('editorVideo');if(!v)return;v.style.filter={Glow:'brightness(1.15) saturate(1.25)',Vivid:'saturate(1.5) contrast(1.08)',Warm:'sepia(.2) saturate(1.3)',Cool:'hue-rotate(18deg) saturate(1.1)',Dream:'brightness(1.08) blur(.2px)',Mono:'grayscale(1)'}[x]||'none'}
function setFilter(x){createState.filter=x;const v=document.getElementById('editorVideo');if(!v)return;v.style.filter={Vivid:'saturate(1.5) contrast(1.08)',Warm:'sepia(.25) saturate(1.3)',Cool:'hue-rotate(20deg) saturate(1.1)',Fade:'brightness(1.08) contrast(.9)', 'B&W':'grayscale(1)'}[x]||'none'}
function setEditorSpeed(x){createState.speed=Number(x);const v=document.getElementById('editorVideo');if(v)v.playbackRate=Number(x);toast(x+'× speed')}
function setTrimStart(x){createState.start=Number(x);document.getElementById('startVal').textContent=x+'%';const v=document.getElementById('editorVideo');if(v&&v.duration)v.currentTime=v.duration*Number(x)/100}
function setTrimEnd(x){createState.end=Number(x);document.getElementById('endVal').textContent=x+'%'}
function buildThumbs(){const rail=document.getElementById('thumbRail');const v=document.getElementById('editorVideo');if(!rail||!v)return;v.addEventListener('loadedmetadata',()=>{rail.innerHTML='';for(let i=0;i<10;i++){const c=document.createElement('canvas');c.width=80;c.height=96;const ctx=c.getContext('2d');const time=v.duration*(i/10);const img=document.createElement('img');img.className='thumb';v.currentTime=time;v.addEventListener('seeked',function f(){ctx.drawImage(v,0,0,80,96);img.src=c.toDataURL('image/jpeg',.65);v.removeEventListener('seeked',f)},{once:true});rail.appendChild(img)}} ,{once:true})}
function applyEditorAndBack(){const v=document.getElementById('editorVideo');if(v){createState.originalVolume=v.volume;createState.speed=v.playbackRate}toast('Edits saved');go('create')}
function startVoiceover(){toast('Voiceover ready')}
function openSoundEditor(){if(!window.createState?.file){toast('Choose a video first');return}go('editclip');setTimeout(()=>editorTool('sound'),80)}
function openPostSheet(){document.getElementById('mediaStage').insertAdjacentHTML('beforeend',`<div class="toolSheet" id="postSheet"><h3>Post details</h3><textarea id="postCaption" class="field" rows="4" maxlength="2200" placeholder="Write a caption… #hashtags @mentions"></textarea><select id="postVisibility" class="field"><option value="public">Everyone</option><option value="followers">Followers</option><option value="friends">Friends</option><option value="private">Only me</option></select><button class="primary" onclick="publishPost()">Post video</button></div>`)}
function loadCreatorMedia(input){const file=input.files?.[0];if(!file)return;window.createState.file=file;const u=URL.createObjectURL(file);const stage=document.getElementById('mediaStage');stage.innerHTML=file.type.startsWith('video/')?`<video id="editVideo" src="${u}" controls playsinline></video>`:`<img src="${u}" alt="Selected post">`;toast('Media ready ✓')}
function loadCreatorSound(input){const file=input.files?.[0];if(!file)return;window.createState.sound=file;window.createState.soundName=file.name;const label=document.getElementById('soundLabel');if(label)label.textContent='🎵 '+file.name;let a=document.getElementById('creatorSoundPreview');if(a)a.remove();a=new Audio(URL.createObjectURL(file));a.id='creatorSoundPreview';a.controls=true;a.volume=window.createState.musicVolume||.8;a.style.width='100%';(label||document.getElementById('mediaStage')).appendChild(a);a.play().catch(()=>{});toast('Sound added')}
async function publishPost(){const st=window.createState||{};if(!st.file){toast('Choose a video first');return}const fd=new FormData();fd.append('media',st.file,st.file.name);fd.append('caption',document.getElementById('postCaption')?.value||'');fd.append('visibility',document.getElementById('postVisibility')?.value||'public');fd.append('editConfig',JSON.stringify({start:st.start,end:st.end,speed:st.speed,originalVolume:st.originalVolume,musicVolume:st.musicVolume,overlayText:st.overlayText,effects:st.effects,filter:st.filter,splitPoints:st.splitPoints}));if(st.sound instanceof File){fd.append('sound',st.sound,st.sound.name);fd.append('soundName',st.soundName||st.sound.name)}else if(st.soundName)fd.append('soundName',st.soundName);const bubble=document.createElement('div');bubble.className='uploadBubble';bubble.innerHTML='Uploading <span>0%</span>';document.body.appendChild(bubble);const pct=bubble.querySelector('span');try{const token=localStorage.getItem('blizz_token')||'';const d=await new Promise((resolve,reject)=>{const x=new XMLHttpRequest();x.open('POST','/api/posts');x.setRequestHeader('Authorization','Bearer '+token);x.upload.onprogress=e=>{if(e.lengthComputable)pct.textContent=Math.round(e.loaded/e.total*100)+'%'};x.onload=()=>{try{const j=JSON.parse(x.responseText);x.status>=200&&x.status<300?resolve(j):reject(Error(j.error||'Video could not be posted'))}catch(_){reject(Error('Video could not be posted'))}};x.onerror=()=>reject(Error('Network error while uploading'));x.send(fd)});pct.textContent='100%';bubble.innerHTML='Uploaded <span>100%</span> ✓';setTimeout(()=>bubble.remove(),800);toast('Posted');go('reels')}catch(e){bubble.remove();toast(e.message||'Video could not be posted')}}
async function openReels(id){go('reels');setTimeout(()=>document.querySelector(`[data-post-id="${CSS.escape(id)}"]`)?.scrollIntoView({behavior:'auto'}),120)}
async function reels(){if(!requireAuth())return;document.getElementById('app').innerHTML=`<main class="reelsPage"><div class="reelsTop"><button onclick="go('home')">←</button><b>Reels</b><button onclick="go('create')">＋</button></div><section id="reelsRail" class="reelsRail"><div class="reelItem"><div style="display:grid;place-items:center;height:100%;color:#aaa">Loading…</div></div></section></main>`;try{const d=await api('/api/posts?mode=foryou'),rail=document.getElementById('reelsRail');rail.innerHTML=d.posts.length?d.posts.map(p=>{const v=p.mediaType.startsWith('video/');return `<article class="reelItem" data-post-id="${attr(p.id)}" ondblclick="likeReel(this,event)">${v?`<video src="${attr(p.mediaUrl)}" playsinline loop preload="metadata" onclick="toggleReel(this)"></video>`:`<img src="${attr(p.mediaUrl)}" alt="">`}<div class="reelShade"></div><div class="reelInfo"><b>@${esc(p.username)}</b><p>${esc(p.caption||'')}</p>${p.soundName?`<div class="reelSound">🎵 ${esc(p.soundName)}</div>`:''}</div><div class="reelActions"><button class="reelAction" onclick="likeReel(this.closest('.reelItem'),event)">❤️</button><span class="reelCount">Like</span><button class="reelAction" onclick="go('comments')">💬</button><span class="reelCount">Comment</span><button class="reelAction" onclick="sharePost('${esc(p.id)}')">↗</button><span class="reelCount">Share</span></div></article>`}).join(''):`<div class="reelItem"><div style="display:grid;place-items:center;height:100%;text-align:center;padding:30px"><div><h2>No reels yet</h2><p>Create your first Blizz video.</p><button class="primary" onclick="go('create')">Create video</button></div></div></div>`;setupReelAutoplay()}catch(e){toast(e.message||'Could not load reels')}}
function toggleReel(v){v.paused?v.play().catch(()=>{}):v.pause()}function likeReel(el,e){if(e)e.stopPropagation();const h=document.createElement('div');h.className='heartBurst';h.textContent='❤️';el.appendChild(h);setTimeout(()=>h.remove(),700)}function setupReelAutoplay(){const rail=document.getElementById('reelsRail');if(!rail)return;const io=new IntersectionObserver(es=>es.forEach(e=>{const v=e.target.querySelector('video');if(v)e.isIntersecting?v.play().catch(()=>{}):v.pause()}),{root:rail,threshold:.7});rail.querySelectorAll('.reelItem').forEach(x=>io.observe(x))}

function wallet(){if(!requireAuth())return;api('/api/wallet').then(d=>{const tx=(d.transactions||[]).map(x=>`<div class="tx"><b>${x.type.includes('credit')||x.type.includes('received')?'＋':'−'} ${Number(x.amount||x.amountMinor||0).toLocaleString()} ${x.amountMinor?'minor units':'🪙'}</b><small>${esc(x.reason||x.type)} • ${new Date(x.time).toLocaleString()}</small></div>`).join('')||'<p class="muted">No transactions yet.</p>';shell(`<main class="page"><span class="pill">BLIZZ WALLET</span><h1 class="title">Your Coins</h1><div class="walletHero"><small>Available balance</small><strong>${Number(d.coins||0).toLocaleString()} 🪙</strong><div class="actions"><button onclick="buyTestCoins()">＋ Buy Coins</button><button onclick="sendGift()">🎁 Send Gift</button><button onclick="go('creatorEarnings')">💰 Creator Earnings</button></div></div><div class="card"><h3>Transaction history</h3>${tx}</div><div class="card"><b>Protected ledger</b><p class="muted">Balances are calculated by the Blizz server ledger. The AI can explain and diagnose transactions, but cannot invent balances.</p></div></main>`)}).catch(e=>toast(e.message))}
function buyTestCoins(){const amount=prompt('Test coin amount (development only):','1000');if(!amount)return;api('/api/coins/test-credit',{method:'POST',body:JSON.stringify({amount:Number(amount)})}).then(d=>{toast('Test coins credited ✓');wallet()}).catch(e=>toast(e.message))}
function sendGift(){const recipient=prompt('Recipient username:');if(!recipient)return;const amount=prompt('Coins to send:','100');if(!amount)return;api('/api/gifts/send',{method:'POST',body:JSON.stringify({recipientUsername:recipient,amount:Number(amount)})}).then(d=>{toast('Gift sent 🎁');wallet()}).catch(e=>toast(e.message))}
function creatorEarnings(){if(!requireAuth())return;api('/api/creator/earnings').then(d=>{const periods=Object.values(d.periods||{}).map(x=>`<div class="tx"><b>${esc(x.period)}</b><small>${Number(x.eligibleViews).toLocaleString()} eligible views • creator share ${Number(x.creatorShareMinor/100).toLocaleString()} currency units</small></div>`).join('')||'<p class="muted">No finalized creator earnings yet.</p>';shell(`<main class="page"><button class="back" onclick="go('wallet')">← Wallet</button><span class="pill">CREATOR REWARDS</span><h1 class="title">Earnings</h1><div class="walletHero"><small>Available for payout</small><strong>${Number(d.availableMinor||0).toLocaleString()} minor units</strong><p class="muted">Eligible activity is finalized by period. Current creator revenue share rule: 60% creator / 40% Blizz.</p></div><div class="card">${periods}</div></main>`)}).catch(e=>toast(e.message))}
function settings(){if(!requireAuth())return;shell(`<main class="page"><button class="back" onclick="back()">← Back</button><h1 class="title">Settings</h1><div class="card"><h3>${esc(currentUser.displayName)}</h3><p class="muted">@${esc(currentUser.username)} • ${esc(currentUser.email||'')}</p><button onclick="go('profile')">View Profile</button><button onclick="go('editprofile')" style="margin-left:8px">Edit Profile</button><button onclick="logout()" style="margin-left:8px">Log Out</button></div><div class="card"><h3>Account</h3><button class="settingRow" onclick="go('profile')">Profile <span>›</span></button><button class="settingRow" onclick="go('privacy')">Privacy & Security <span>›</span></button><button class="settingRow" onclick="go('notifications')">Notifications <span>›</span></button></div><div class="card"><h3>App</h3><button class="settingRow" onclick="go('accessibility')">Accessibility <span>›</span></button><button class="settingRow" onclick="go('dataSaver')">Data Saver <span>›</span></button><button class="settingRow" onclick="go('contentPrefs')">Content Preferences <span>›</span></button><button class="settingRow" onclick="go('appearance')">Appearance <span>›</span></button><button class="settingRow" onclick="go('help')">Help & Support <span>›</span></button><button class="settingRow" onclick="go('about')">About Blizz <span>›</span></button></div></main>`)}
function online(){shell(`<main class="page"><button class="back" onclick="go('matchup')">← Matchup</button><h1 class="title">Online Players</h1><div class="card"><b>🟢 BlizzPlayer</b><p class="muted">Looking for Trivia</p><button onclick="go('lobby')">Invite</button></div></main>`)}
function leaderboard(){shell(`<main class="page"><button class="back" onclick="go('games')">← Games</button><h1 class="title">Leaderboard</h1><div class="card"><p>🥇 BlizzPlayer — 98</p><p>🥈 NovaPlayer — 94</p><p>🥉 GameKing — 91</p></div></main>`)}
function auth(){document.getElementById('app').innerHTML=`<div class="app"><main class="page"><div class="authHero"><div class="brand">♛ B • Blizz</div><p class="sub">Connect • Watch • Play • Create</p></div><div class="card authCard" id="authCard"><div class="segment"><button id="loginTab" onclick="authMode('login')">Log In</button><button id="signupTab" onclick="authMode('signup')">Create Account</button></div><div id="authForm"></div></div><p class="muted" style="text-align:center;font-size:12px">Create your Blizz account with basic profile information.</p></main></div>`;authMode('login')}
function authMode(mode){const f=document.getElementById('authForm');if(!f)return;document.getElementById('loginTab')?.classList.toggle('active',mode==='login');document.getElementById('signupTab')?.classList.toggle('active',mode==='signup');f.innerHTML=mode==='login'?`<h2>Welcome back</h2><input id="login" class="field" placeholder="Username or email"><input id="password" type="password" class="field" placeholder="Password" autocomplete="current-password"><div id="authError" class="error"></div><button class="primary" onclick="doLogin()">LOG IN</button><div class="recovery"><button onclick="go('forgot')">Forgot password?</button></div>`:`<h2>Create your Blizz account</h2><input id="username" class="field" placeholder="Username"><input id="displayName" class="field" placeholder="Display name"><input id="email" class="field" type="email" placeholder="Email" autocomplete="email"><input id="phone" class="field" type="tel" placeholder="Phone number (optional)"><input id="password" class="field" type="password" placeholder="Password (8+ characters)"><input id="dob" class="field" type="date"><select id="gender" class="field"><option value="">Select gender</option><option>Male</option><option>Female</option><option>Non-binary</option><option>Prefer not to say</option></select><div id="authError" class="error"></div><button class="primary" onclick="doSignup()">CREATE ACCOUNT</button>`} 
function doSignup(){const e=document.getElementById('authError');e.textContent='Creating account…';api('/api/signup',{method:'POST',body:JSON.stringify({username:document.getElementById('username').value,displayName:document.getElementById('displayName').value,email:document.getElementById('email').value,phone:document.getElementById('phone')?.value||'',password:document.getElementById('password').value,dob:document.getElementById('dob').value,gender:document.getElementById('gender').value})}).then(d=>{saveSession(d);toast('Account created 🎉');localStorage.removeItem('blizz_onboarded');go('tutorial')}).catch(x=>e.textContent=x.message)}
async function doLogin(){const e=document.getElementById('authError');e.textContent='Signing in…';const login=(document.getElementById('login')?.value||'').trim();const password=document.getElementById('password')?.value||'';if(!login||!password){e.textContent='Enter your username/email and password.';return}localStorage.removeItem('blizz_token');localStorage.removeItem('blizz_user');currentUser=null;try{const d=await api('/api/login',{method:'POST',body:JSON.stringify({login,password})});saveSession(d);toast('Welcome back 👋');go(localStorage.getItem('blizz_onboarded')==='1'?'home':'tutorial')}catch(x){e.textContent=x.message||'Unable to sign in. Please try again.'}}
function forgot(){shell(`<main class="page"><button class="back" onclick="go('auth')">← Log in</button><div class="card authCard"><span class="pill">ACCOUNT RECOVERY</span><h1 class="title">Reset your password</h1><p class="muted">Enter the email, username, or phone number linked to your account. We'll send a verification code.</p><input id="recoverId" class="field" placeholder="Email, username or phone number"><div id="recoverError" class="error"></div><button class="primary" onclick="requestReset()">SEND VERIFICATION CODE</button></div></main>`)}
async function requestReset(){const e=document.getElementById('recoverError'),identifier=document.getElementById('recoverId').value.trim();if(!identifier){e.textContent='Enter your email, username, or phone number.';return}e.textContent='Sending verification code…';try{const d=await api('/api/password/request',{method:'POST',body:JSON.stringify({identifier})});localStorage.setItem('blizz_reset_id',d.resetId||'');localStorage.setItem('blizz_reset_destination',d.destination||'your recovery email');if(d.otp)localStorage.setItem('blizz_test_otp',d.otp);toast('Verification code sent');go('verifyReset')}catch(x){e.textContent=x.message}}
function verifyReset(){shell(`<main class="page"><button class="back" onclick="go('forgot')">← Back</button><div class="card authCard"><span class="pill">VERIFY</span><h1 class="title">Enter verification code</h1><p class="muted">Enter the 6-digit code sent to ${esc(localStorage.getItem('blizz_reset_destination')||'your recovery email')}.</p><input id="resetOtp" class="field" inputmode="numeric" maxlength="6" placeholder="6-digit code"><div id="verifyError" class="error"></div><button class="primary" onclick="verifyResetCode()">VERIFY CODE</button><p class="authHint">Never share your verification code with anyone.</p></div></main>`)}
async function verifyResetCode(){const e=document.getElementById('verifyError'),otp=document.getElementById('resetOtp').value.trim(),resetId=localStorage.getItem('blizz_reset_id')||'';if(!/^\d{6}$/.test(otp)){e.textContent='Enter the 6-digit verification code.';return}e.textContent='Checking code…';try{const d=await api('/api/password/verify',{method:'POST',body:JSON.stringify({resetId,otp})});localStorage.setItem('blizz_reset_token',d.resetToken);go('resetPassword')}catch(x){e.textContent=x.message}}
function resetPassword(){shell(`<main class="page"><button class="back" onclick="go('auth')">← Log in</button><div class="card authCard"><span class="pill">NEW PASSWORD</span><h1 class="title">Create a new password</h1><p class="muted">Choose a new password with at least 8 characters.</p><input id="newPassword" class="field" type="password" placeholder="New password" autocomplete="new-password"><input id="newPassword2" class="field" type="password" placeholder="Confirm new password" autocomplete="new-password"><div id="resetError" class="error"></div><button class="primary" onclick="submitNewPassword()">CHANGE PASSWORD</button></div></main>`)}
async function submitNewPassword(){const e=document.getElementById('resetError'),a=document.getElementById('newPassword').value,b=document.getElementById('newPassword2').value,token=localStorage.getItem('blizz_reset_token')||'';if(a.length<8){e.textContent='New password must be at least 8 characters.';return}if(a!==b){e.textContent='The passwords do not match.';return}e.textContent='Changing password…';try{const d=await api('/api/password/reset',{method:'POST',body:JSON.stringify({resetToken:token,newPassword:a})});['blizz_reset_id','blizz_reset_destination','blizz_reset_token','blizz_test_otp'].forEach(k=>localStorage.removeItem(k));toast(d.message||'Password changed');go('auth')}catch(x){e.textContent=x.message}}
function tutorial(){shell(`<main class="page"><div class="guideHero"><span class="pill">WELCOME TO BLIZZ</span><h1 class="title">Your Blizz, your way.</h1><p class="sub">A quick guide before you start.</p></div><div class="guideGrid"><div class="guideItem"><b>🏠 Discover</b><span class="muted">Explore your feed, follow creators and keep up with friends.</span></div><div class="guideItem"><b>📺 Watch & Stream</b><span class="muted">Watch videos, join LIVE rooms and share moments.</span></div><div class="guideItem"><b>🎮 Play</b><span class="muted">Challenge friends, match with players and play Blizz games.</span></div><div class="guideItem"><b>➕ Create</b><span class="muted">Post photos or videos, add sounds and build your profile.</span></div><div class="guideItem"><b>💬 Connect</b><span class="muted">Message people and control who can interact with you.</span></div><div class="guideItem"><b>⚙️ Control</b><span class="muted">Settings, safety, notifications, appearance and support are always close.</span></div></div><button class="primary" style="margin-top:14px" onclick="localStorage.setItem('blizz_onboarded','1');go('home')">START EXPLORING BLIZZ</button></main>`)}

function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}
function attr(v){return esc(v)}
function render(){const publicRoutes=['auth','forgot','verifyReset','resetPassword'];if(!currentUser&&!publicRoutes.includes(route)){auth();return}if(!BANK.length&&route==='quiz')return;({home,create,editclip,reels,wallet,creatorEarnings,games,quiz,results,stream,songquiz,live,startlive,watch,ad,matchup,searching,lobby,messages,chat,profile,editprofile,comments,settings,privacy,privacysettings,blocked,security,sessions,dataprivacy,contentfilter,safety,notifications,accessibility,appearance,dataSaver,contentPrefs,help,about,online,leaderboard,forgot,verifyReset,resetPassword,tutorial}[route]||home)()}

</script>
<style>
#blizzAI{position:fixed;right:12px;bottom:76px;width:min(390px,calc(100vw - 24px));max-height:72vh;z-index:100;background:#11101e;border:1px solid #3b3158;border-radius:22px;box-shadow:0 18px 60px #000b;overflow:hidden;display:none}
#blizzAI .aiHead{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:linear-gradient(135deg,#1d1740,#35113e)}
#blizzAI .aiHead small{display:block;color:#aaa5bd;margin-top:3px}#blizzAI .aiClose{background:transparent;font-size:24px;padding:4px 8px}
#blizzAIMsgs{padding:13px;max-height:45vh;overflow:auto}.aiMsg{padding:10px 12px;border-radius:15px;background:#211b37;margin:7px 0;line-height:1.4}.aiUser{background:#432a73;margin-left:20px}
body[data-theme=light] #blizzAI{background:#fff;color:#111;border-color:#dfe2ea}body[data-theme=light] #blizzAI .aiHead{background:linear-gradient(135deg,#f0edff,#ffeaf5)}body[data-theme=light] .aiMsg{background:#f1f2f6;color:#161821}.aiInput{display:flex;gap:7px;padding:10px;border-top:1px solid #2c2645}.aiInput input{flex:1;min-width:0}.aiInput button{background:linear-gradient(90deg,#7656ff,#e94eaa)}
.aiQuick{display:flex;gap:6px;padding:8px 10px;overflow:auto}.aiQuick button{white-space:nowrap;padding:8px 10px;border-radius:999px;font-size:11px}.aiFix{background:#25d9a5!important;color:#07140f!important;margin-top:6px}.aiTicket{margin-top:6px}
</style>
<div id="blizzAI">
 <div class="aiHead"><div><b>🤖 Blizz AI Support</b><small>Diagnose • Safe Fix • Support Ticket</small></div><button class="aiClose" onclick="closeBlizzAI()">×</button></div>
 <div id="blizzAIMsgs"><div class="aiMsg">Hi! Tell me what is wrong with Blizz. I can diagnose common problems and offer a safe repair when one is available.</div></div>
 <div class="aiQuick"><button onclick="aiQuick('I entered the wrong password and cannot log in')">Wrong password</button><button onclick="aiQuick('I forgot my password')">Forgot password</button></div><div class="aiInput"><input id="blizzAIInput" class="field" placeholder="Tell Blizz what went wrong"><button onclick="sendBlizzAI()">Send</button></div>
</div>
<script>
function openBlizzAI(){const p=document.getElementById('blizzAI');if(p)p.style.display='block';}
function closeBlizzAI(){const p=document.getElementById('blizzAI');if(p)p.style.display='none';}
function aiQuick(text){const input=document.getElementById('blizzAIInput');if(input){input.value=text;sendBlizzAI()}}
function aiAdd(text,user){const box=document.getElementById('blizzAIMsgs');const d=document.createElement('div');d.className='aiMsg '+(user?'aiUser':'');d.textContent=text;box.appendChild(d);box.scrollTop=box.scrollHeight;}
async function sendBlizzAI(){const input=document.getElementById('blizzAIInput');const text=input.value.trim();if(!text)return;input.value='';aiAdd(text,true);const history=[...document.querySelectorAll('#blizzAIMsgs .aiMsg')].slice(-20).map(x=>({role:x.classList.contains('aiUser')?'user':'assistant',content:x.textContent}));history.push({role:'user',content:text});try{const token=localStorage.getItem('blizz_token')||'';const r=await fetch('/api/ai/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({messages:history})});const d=await r.json();if(d.answer){aiAdd(d.answer);return}if(d.fallback){aiAdd(d.fallback.answer);return}throw Error(d.error||'AI unavailable')}catch(e){try{const r=await fetch('/api/ai/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const d=await r.json();aiAdd(d.diagnosis?.answer||'Blizz AI is temporarily unavailable.');if(/password|log in|login|sign in|session/i.test(text)){const b=document.createElement('button');b.className='aiFix';b.textContent='🔐 Open password recovery';b.onclick=()=>go('forgot');document.getElementById('blizzAIMsgs').appendChild(b)}if(d.diagnosis?.safeFix){const b=document.createElement('button');b.className='aiFix';b.textContent='🔧 Try safe session fix';b.onclick=async()=>{b.disabled=true;const token=localStorage.getItem('blizz_token')||'';const rr=await fetch('/api/ai/autofix',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},body:JSON.stringify({message:text})});const x=await rr.json();aiAdd(x.message||'Repair completed.');if(x.ok)setTimeout(()=>go('auth'),700)};document.getElementById('blizzAIMsgs').appendChild(b)}}catch(_){aiAdd('Blizz Support is temporarily unavailable. Please try again or create a support ticket.')}}}
</script>
<script>function founderAI(){openBlizzAI();}</script></body></html>
